const T1='Prospective Reserves & Special Benefit Patterns',T2='Reserve Recursion & Fackler’s Formula',T3='Variance of the Prospective Loss (Hattendorff)',T4='Reserve-Based Death Benefits',T5='Fractional-Duration Reserves',T6='Retrospective Reserves & Premium Relationships',TOPICS=[T1,T2,T3,T4,T5,T6],U1='Expense-Loaded Premiums (Equivalence Principle)',U2='Gross Premium Reserves & Thiele’s Equation',U3='Expense Reserves & Full Preliminary Term (FPT)',U4='Pricing Basis vs. Actual Experience',U5='Asset Shares & Gain Analysis',TOPICS7=[U1,U2,U3,U4,U5],X1='Multiple Decrement Tables',X2='Forces of Decrement & Cause of Decrement',X3='Associated Single Decrement Tables',X4='Uniform Distribution of Decrements',X5='Constant Force of Decrement',X6='Discrete Jumps & Mixed Assumptions',TOPICS8=[X1,X2,X3,X4,X5,X6],Y1='APV of Cash Flows with Multiple Decrements',Y2='Reserves & Prospective Loss',Y3='Profit & Gain by Source',Y4='Cash Values: Paid-Up & Extended Term Options',Y5='Asset Shares with Withdrawals',TOPICS9=[Y1,Y2,Y3,Y4,Y5],Z1='Discrete-Time Markov Chains',Z2='Transition Probabilities from Decrement Tables',Z3='Kolmogorov Equations & Occupancy',Z4='Numerical Integration of Transition Probabilities',Z5='Disability Income Valuation',TOPICS10=[Z1,Z2,Z3,Z4,Z5],W1='Joint-Life & Last-Survivor Statuses',W2='Order of Deaths & Contingent Probabilities',W3='Insurances & Annuities on Two Lives',W4='Contingent & Reversionary Benefits',W5='Gompertz & Makeham Laws',TOPICS11=[W1,W2,W3,W4,W5];
const R=String.raw,V4=R`Special single-premium 2-year endowment on (x): death benefits (end of year) \(b_1=3000\), \(b_2=2000\); maturity benefit 1000; expenses at the start of each year: 2% taxes and 3% commissions of the expense-loaded premium, plus 15 in year 1 and 2 in year 2; \(i=0.04\); \(p_x=0.9\), \(p_{x+1}=0.8\); the expense-loaded premium is 1372.33.`,V33=R`Fully discrete 20-year term on (40), death benefit 10,000 at the end of the year of death. Year 4: gross premium 90 per policy at the start of the year; gross premium reserves 100 (end of year 3) and 125 (end of year 4); expenses at the start of the year as a % of premium: anticipated 3%, actual 2.5%; \(q_{43}\): anticipated 0.003, actual 0.002; interest: anticipated 5%, actual 4%. 1000 policies were issued; 990 are in force at the end of year 3.`,W=R`(65) buys a whole life annuity paying 1000 at the end of each year. Gross single premium 15,000; 1000 policies are in force at the start of year 10; the gross premium reserve at the end of year 9 is 10,994.49. Anticipated: \(q_{74}=0.01\), \(i=6\%\), expenses 50 per policy. Actual: 12 deaths, \(i=5\%\), expenses 60 per policy. Expenses are paid at the end of the year for each survivor.`;
const Q=[
{t:T1,d:'Medium',q:R`Special fully continuous whole life on (65): death benefit at time \(t\) is \(b_t=1000e^{0.04t}\); level benefit premiums payable for life; \(\mu_{65+t}=0.02\); \(\delta=0.04\). Calculate the benefit reserve at the end of year 2.`,o:['0','29','37','61','83'],a:4,s:R`APV of future benefits at \(h\): \(1000e^{0.04h}\int_0^\infty e^{0.04t}e^{-0.04t}\,{}_tp\,\mu\,dt=1000e^{0.04h}\cdot\frac{0.02}{0.02}=1000e^{0.04h}\). Premium annuity: \(\bar a=1/0.06\). So \({}_hV=1000e^{0.04h}-\pi/0.06\). From \({}_0V=0\), \(\pi=60\). Then \({}_2V=1000e^{0.08}-1000=83.29\).`},
{t:T1,d:'Medium',q:R`Special fully discrete 20-year endowment on (40): death benefit 1000 for the first 10 years, 2000 thereafter; pure endowment 2000; benefit premium 40 for years 1–10 and 100 thereafter; \(q_{40+k}=0.001k+0.001\) for \(k=8,9,\dots,13\); \(i=0.05\); \(\ddot a_{51:\overline{9}|}=7.1\). Calculate the 10th-year terminal reserve.`,o:['490','500','530','550','560'],a:1,s:R`Over the last 10 years the benefit is 2000 whether (50) dies or survives, so \({}_{10}V=2000A_{50:\overline{10}|}-100\ddot a_{50:\overline{10}|}=2000-195.238\,\ddot a_{50:\overline{10}|}\). With \(q_{50}=0.011\): \(\ddot a_{50:\overline{10}|}=1+\frac{0.989}{1.05}(7.1)=7.6875\). Hence \({}_{10}V=499.1\).`},
{t:T1,d:'Medium',q:R`A machine aged 25 is covered by a 5-year term insurance paying 500,000 at the moment of breakdown. Annual benefit premiums of 6643 are paid at the start of each year. Breakdowns follow De Moivre’s law with \(\ell_x=100-x\); \(i=0.06\). Calculate the benefit reserve at the end of year 3.`,o:['−91','0','163','287','422'],a:3,s:R`At age 28, remaining life limit is 72 years. \(\bar A^1_{28:\overline{2}|}=\frac{1}{72}\bar a_{\overline{2}|}=\frac{1-1.06^{-2}}{72\ln1.06}=0.0262203\). \(\ddot a_{28:\overline{2}|}=1+\frac{71/72}{1.06}=1.930294\). So \({}_3V=500000(0.0262203)-6643(1.930294)=287.2\).`},
{t:T1,d:'Medium',q:R`Fully continuous whole life of 1 on (30). Force of mortality is 0.05 for the first 10 years and 0.08 thereafter; \(\delta=0.08\). Calculate the benefit reserve at time 10.`,o:['0.144','0.155','0.166','0.177','0.188'],a:0,s:R`After age 40, \(\mu=0.08\), so \(\bar a_{40}=1/0.16=6.25\). \(\bar a_{30:\overline{10}|}=\frac{1-e^{-1.3}}{0.13}=5.5959\), \({}_{10}E_{30}=e^{-1.3}\), so \(\bar a_{30}=5.5959+e^{-1.3}(6.25)=7.2992\). Reserve \(=1-\bar a_{40}/\bar a_{30}=1-6.25/7.2992=0.1437\).`},
{t:T1,d:'Hard',q:R`Whole life of 1 on (40), \(i=0.06\). Given \(p_{50}=p_{51}=p_{52}\), \({}_{10}V_{40}={}_{13}V_{40}\) and \(\ddot a_{50}=10.0\). Calculate \(p_{50}\).`,o:['0.942','0.946','0.950','0.954','0.958'],a:3,s:R`\({}_hV=1-\ddot a_{40+h}/\ddot a_{40}\), so equal reserves give \(\ddot a_{50}=\ddot a_{53}=10\). With \(p=p_{50}\): \(\ddot a_{50}=1+vp+v^2p^2+v^3p^3\ddot a_{53}\), i.e. \(10\big(1-\tfrac{p^3}{1.06^3}\big)=1+\tfrac p{1.06}+\tfrac{p^2}{1.06^2}\). Using \(a^3-b^3=(a-b)(a^2+ab+b^2)\) this reduces to \(10(1-p/1.06)=1\), so \(p=1.06(0.9)=0.954\).`},
{t:T2,d:'Easy',q:R`Fully discrete whole life of 1000 on (50): \(1000P_{50}=25\), \(1000A_{61}=440\), \(1000q_{60}=20\), \(i=0.06\). Calculate \(1000\,{}_{10}V_{50}\).`,o:['170','172','174','176','178'],a:1,s:R`\(1000A_{60}=\frac{20+0.98(440)}{1.06}=425.66\). \(\ddot a_{60}=\frac{1-0.42566}{0.06/1.06}=10.1467\). Then \(1000\,{}_{10}V_{50}=1000A_{60}-25\ddot a_{60}=425.66-253.67=171.99\).`},
{t:T2,d:'Easy',q:R`Fully discrete 3-year endowment of 1000 on (x): \(q_x=q_{x+1}=0.20\), \(i=0.06\), \(1000P_{x:\overline{3}|}=373.63\). Calculate \({}_2V-{}_1V\).`,o:['320','325','330','335','340'],a:1,s:R`\({}_3V=1000\). \(({}_2V+373.63)(1.06)=1000\Rightarrow{}_2V=569.77\). \((0+373.63)(1.06)=200+0.8\,{}_1V\Rightarrow{}_1V=245.05\). Difference \(=324.72\approx325\).`},
{t:T2,d:'Medium',q:R`Special fully discrete 3-year term on (x) with level benefit premiums. Death benefit \(b_{k+1}\) and \(q_{x+k}\): \(k=0\): 200,000, 0.03; \(k=1\): 150,000, 0.06; \(k=2\): 100,000, 0.09. \(i=0.06\). Calculate the initial benefit reserve for year 2.`,o:['6,500','7,500','8,100','9,400','10,300'],a:3,s:R`APV benefits \(=\frac{6000}{1.06}+\frac{150000(0.97)(0.06)}{1.06^2}+\frac{100000(0.9118)(0.09)}{1.06^3}\approx20{,}320.1\); \(\ddot a=1+\frac{0.97}{1.06}+\frac{0.9118}{1.06^2}=2.7266\), so \(\pi=7452.6\). Recursion: \(7452.6(1.06)=6000+0.97\,{}_1V\Rightarrow{}_1V=1958.5\). Initial reserve for year 2 \(={}_1V+\pi=9411\).`},
{t:T2,d:'Easy',q:R`Fully discrete 3-year endowment of 1000 on (x): \(i=0.05\), \(p_x=p_{x+1}=0.7\). Calculate the second-year terminal benefit reserve.`,o:['526','632','739','845','952'],a:0,s:R`\(\ddot a_{x:\overline{3}|}=1+\frac{0.7}{1.05}+\frac{0.49}{1.05^2}=\frac{19}{9}\), so \(1000P=\frac{1000}{\ddot a}-1000d=426.07\). The year-3 payoff is 1000 either way, so \(({}_2V+426.07)(1.05)=1000\Rightarrow{}_2V=526.3\).`},
{t:T2,d:'Medium',q:R`Fully discrete 20-payment whole life of 1000 on (x): \(i=0.06\), \(q_{x+19}=0.01254\), level annual benefit premium 13.72, reserve at end of year 19 is 342.03. Calculate \(1000P_{x+20}\), the premium for a fully discrete whole life of 1000 on \((x+20)\).`,o:['27','29','31','33','35'],a:3,s:R`No premiums after year 20, so \({}_{20}V=1000A_{x+20}\). Recursion: \({}_{20}V=\frac{(342.03+13.72)(1.06)-12.54}{0.98746}=369.18\), so \(A_{x+20}=0.36918\). Then \(1000P_{x+20}=\frac{1000\,dA}{1-A}=\frac{369.18(0.06/1.06)}{1-0.36918}=33.13\).`},
{t:T2,d:'Hard',q:R`Michel (45) has higher-than-standard mortality only at age 64. Special fully discrete whole life of 1: non-level premiums; \(\pi_{19}=P_{45}+0.010\); his reserves equal those of a standard fully discrete whole life of 1 on (45) with level premiums; \(i=0.03\); \({}_{20}V_{45}=0.427\). Calculate \(q^*_{64}-q_{64}\).`,o:['0.012','0.014','0.016','0.018','0.020'],a:3,s:R`Michel: \(({}_{19}V+P_{45}+0.01)(1.03)={}_{20}V+q^*(1-{}_{20}V)\). Standard: \(({}_{19}V+P_{45})(1.03)={}_{20}V+q(1-{}_{20}V)\). Subtracting: \(0.0103=(q^*-q)(1-0.427)\), so \(q^*-q=0.01798\approx0.018\).`},
{t:T2,d:'Medium',q:R`Fully discrete whole life of \(b\) on (x): \(q_{x+9}=0.02904\), \(i=0.03\), initial reserve for year 10 is 343, net amount at risk for year 10 is 872, \(\ddot a_x=14.65976\). Calculate the terminal reserve for year 9.`,o:['280','288','296','304','312'],a:2,s:R`\(({}_9V+\pi)(1.03)={}_{10}V+q(b-{}_{10}V)\): \(343(1.03)={}_{10}V+0.02904(872)\Rightarrow{}_{10}V=327.967\). Then \(b=872+327.967=1199.97\), \(\pi=b\big(\frac1{\ddot a_x}-d\big)=46.90\), so \({}_9V=343-46.90=296.1\).`},
{t:T3,d:'Medium',q:R`Fully discrete 2-year term of 1 on (x): \(q_x=0.1\), \(q_{x+1}=0.2\), \(v=0.9\). \({}_1L\) is the prospective loss at time 1 using the equivalence-principle premium. Calculate \(\mathrm{Var}({}_1L\mid K_x\ge1)\).`,o:['0.05','0.07','0.09','0.11','0.13'],a:4,s:R`Hattendorff: \(\mathrm{Var}({}_1L\mid K_x\ge1)=v^2(b_2-{}_2V)^2p_{x+1}q_{x+1}=0.9^2(1-0)^2(0.8)(0.2)=0.1296\). (\(q_x\) is not needed.)`},
{t:T3,d:'Easy',q:R`Insurer’s loss \(L\) for a fully discrete 2-year endowment of 10 on (x); premiums by the equivalence principle but not necessarily level. \(d=0.1\), \(\mathrm{Var}(L)=3.24\), \({}_1V=5.00\). Calculate \(p_xq_x\).`,o:['0.09','0.16','0.21','0.24','0.25'],a:1,s:R`Year 2 payoff is certain, so \(\mathrm{Var}({}_1L\mid K\ge1)=0\). Hattendorff: \(\mathrm{Var}(L)=v^2(b_1-{}_1V)^2p_xq_x\). With \(v=0.9\): \(3.24=0.81(10-5)^2p_xq_x\Rightarrow p_xq_x=0.16\).`},
{t:T4,d:'Medium',q:R`Special fully discrete 2-year endowment on (x): pure endowment 2000; death benefit in year \(k\) is \(1000k\) plus the reserve at end of year \(k\); \(\pi\) level; \(i=0.08\); \(p_{x+k-1}=0.9\), \(k=1,2\). Calculate \(\pi\).`,o:['1027','1047','1067','1087','1107'],a:0,s:R`\({}_2V=2000\). Year 2: \(1.08({}_1V+\pi)={}_2V+q(b_2-{}_2V)=2000+0.1(2000)=2200\). Year 1: \(1.08\pi={}_1V+0.1(1000)\). Subtract: \(1.08\,{}_1V=2200-{}_1V-100\Rightarrow{}_1V=1009.62\). Then \(\pi=(1009.62+100)/1.08=1027.4\).`},
{t:T4,d:'Hard',q:R`Special single-premium 20-year term on (70): death benefit (end of year of death) is 1000 plus the benefit reserve; \(q_{x+t}=0.03\) for all \(t\); \(i=0.07\). Calculate the single benefit premium.`,o:['216','267','318','369','420'],a:2,s:R`With \(b_{h+1}={}_{h+1}V+1000\): \(1.07({}_hV+\pi_h)={}_{h+1}V+30\). Multiply by \(v^{h+1}\) and sum from \(h=0\) to \(19\): \(\pi=30\,a_{\overline{20}|}\) (since \({}_{20}V=0\)). So \(\pi=30\cdot\frac{1-1.07^{-20}}{0.07}=317.8\).`},
{t:T5,d:'Medium',q:R`\(i=1.03^2-1\), \(q_{x+10}=0.08\), \(1000\,{}_{10}V_x=311.00\), \(1000P_x=60.00\), \(1000\,{}_{11}V_x=340.86\), deaths UDD. The reserve \(1000\,{}_{10.5}V_x\) is approximated by \(500({}_{10}V_x+{}_{11}V_x+P_x)\). By how much does the approximation understate the exact reserve?`,o:['1.00','1.33','1.67','2.00','2.33'],a:2,s:R`Approximation: \(0.5(311+340.86+60)=355.93\). Exact: \({}_{0.5}q_{x+10}=0.04\) and \((1+i)^{0.5}=1.03\), so \(1.03(311+60)=0.04\,\tfrac{1000}{1.03}+0.96\,{}_{10.5}V\Rightarrow{}_{10.5}V=357.60\). Understatement \(=357.60-355.93=1.67\).`},
{t:T5,d:'Easy',q:R`A 10-year endowment is issued to (x) on May 1, 1984 with true quarterly premium 240. Net level premium reserves at the end of policy years 1 and 2 are 996 and 2025. Deaths are UDD. Approximate the reserve at December 31, 1985.`,o:['1682','1702','1722','1742','1762'],a:4,s:R`Dec 31, 1985 is \(t=1\tfrac23\) years. Interpolate: \(\tfrac13(996)+\tfrac23(2025)=1682\). The last premium (Nov 1) has only 2 of 3 months earned, so add the unearned third: \(+\tfrac13(240)=80\). Total \(=1762\).`},
{t:T1,d:'Easy',q:R`Fully discrete whole life of 1000 on select life [60]. Ultimate mortality follows the Illustrative Life Table (\(1000A_{65}=439.80\)); select period 3 years; \(i=0.06\); \(1000A_{[60]}=359.00\). Calculate \(1000\,{}_5V_{[60]}\).`,o:['112','116','121','126','130'],a:3,s:R`Beyond the select period, \(A_{[60]+5}=A_{65}\). So \({}_5V=\frac{A_{65}-A_{[60]}}{1-A_{[60]}}=\frac{0.43980-0.359}{1-0.359}\), giving \(1000\,{}_5V=126.05\).`},
{t:T1,d:'Medium',q:R`Fully continuous whole life of 1 on (40). Mortality follows De Moivre’s law with \(\omega=100\); \(i=0.05\). Annuity-certain values: \(\bar a_{\overline{40}|}=17.58\), \(\bar a_{\overline{50}|}=18.71\), \(\bar a_{\overline{60}|}=19.40\). Calculate the benefit reserve at time 10.`,o:['0.075','0.077','0.079','0.081','0.083'],a:0,s:R`Under De Moivre, \(\bar A_x=\bar a_{\overline{\omega-x}|}/(\omega-x)\). \(\bar A_{50}=18.71/50=0.3742\), \(\bar A_{40}=19.40/60=0.32333\). Then \({}_{10}\bar V=\frac{\bar A_{50}-\bar A_{40}}{1-\bar A_{40}}=\frac{0.05087}{0.67667}=0.0752\).`},
{t:T1,d:'Hard',q:R`Special fully discrete whole life on (25). At the end of the year of death a random drawing pays 1000 with probability 0.2, otherwise 0. At the start of each year while alive a random drawing requires the level premium \(\pi\) with probability 0.8, otherwise nothing. Drawings are independent; \(i=0.06\); \(\pi\) by the equivalence principle. ILT values: \(1000A_{25}=81.65\), \(\ddot a_{25}=16.2242\), \(1000A_{35}=128.72\), \(\ddot a_{35}=15.3926\). Calculate the benefit reserve at the end of year 10.`,o:['10.25','20.50','30.75','41.00','51.25'],a:0,s:R`Expected benefit is \(200A_x\); expected premium is \(0.8\pi\ddot a_x\). So \(\pi=\frac{0.2(81.65)}{0.8(16.2242)}=1.25815\). Then \({}_{10}V=200A_{35}-0.8\pi\ddot a_{35}=25.744-0.8(1.25815)(15.3926)=10.25\).`},
{t:T2,d:'Medium',q:R`Special fully discrete 20-year endowment on (55): death benefit in year \(k\) is \(b_k=21-k\); maturity benefit 1; level annual benefit premium; \({}_{10}V=5.0\), \({}_{19}V=0.6\), \(q_{65}=0.10\), \(i=0.08\). Calculate \({}_{11}V\).`,o:['4.5','4.6','4.8','5.1','5.3'],a:4,s:R`Year 20 pays 1 either way: \(({}_{19}V+\pi)(1.08)=1\Rightarrow\pi=0.325926\). Year 11 has \(b_{11}=10\): \(({}_{10}V+\pi)(1.08)=0.9\,{}_{11}V+0.1(10)\), so \({}_{11}V=\frac{5.325926(1.08)-1}{0.9}=5.28\).`},
{t:T2,d:'Medium',q:R`Fully discrete 10-payment whole life of 100,000 on (x): \(i=0.05\); \(q_{x+9}=0.011\), \(q_{x+10}=0.012\), \(q_{x+11}=0.014\); level annual benefit premium 2078; reserve at end of year 9 is 32,535. Calculate \(100{,}000A_{x+11}\).`,o:['34,100','34,300','35,500','36,500','36,700'],a:4,s:R`\(100000A_{x+11}={}_{11}V\) (no more premiums). \({}_{10}V=\frac{(32535+2078)(1.05)-1100}{0.989}=35{,}635.6\). \({}_{11}V=\frac{35635.6(1.05)-1200}{0.988}=36{,}657\approx36{,}700\).`},
{t:T2,d:'Easy',q:R`Fully discrete 5-payment, 10-year decreasing term on (60): \(b_{k+1}=1000(10-k)\), \(k=0,\dots,9\); benefit premiums of 218.15 for five years; \(q_{60+k}=0.02+0.001k\); \(i=0.06\). Calculate \({}_2V\).`,o:['70','72','74','76','78'],a:4,s:R`\({}_1V=\frac{218.15(1.06)-10000(0.02)}{0.98}=31.88\). \({}_2V=\frac{(31.88+218.15)(1.06)-9000(0.021)}{0.979}=77.66\).`},
{t:T2,d:'Medium',q:R`Type A is a fully discrete 10-payment whole life of 1000 on (x); Type B is a fully discrete whole life of 1000 on (x) with annual benefit premium 8.36. \(q_{x+10}=0.004\); \(i=0.06\); \({}_{10}V^A-{}_{10}V^B=101.35\). Calculate \({}_{11}V^A-{}_{11}V^B\).`,o:['91','93','95','97','99'],a:4,s:R`Type A has no premium in year 11, Type B pays 8.36. Subtracting the recursions: \({}_{11}V^A-{}_{11}V^B=\frac{1.06(101.35)-8.36(1.06)}{0.996}=\frac{107.431-8.8616}{0.996}=98.97\).`},
{t:T2,d:'Hard',q:R`Fully discrete whole life with non-level benefits on (70): the level benefit premium equals \(P_{50}\); \(q_{70+k}=q_{50+k}+0.01\) for \(k=0,\dots,19\); \(q_{60}=0.01368\); \({}_kV={}_kV_{50}\) (the reserve of a standard whole life of 1 on (50)) for \(k=0,\dots,19\); \({}_{11}V_{50}=0.16637\). Calculate \(b_{11}\).`,o:['0.482','0.624','0.636','0.648','0.834'],a:3,s:R`Subtract the two recursions (same reserves and premiums): \((q_{60}+0.01)(b_{11}-{}_{11}V_{50})=q_{60}(1-{}_{11}V_{50})\). So \(0.02368(b_{11}-0.16637)=0.01368(0.83363)\), giving \(b_{11}=0.648\).`},
{t:T2,d:'Hard',q:R`Special fully discrete whole life of 1000 on (42). Contract premium for the first 4 years equals the level benefit premium of a whole life of 1000 on (40); after year 4 it equals that for (42). ILT: \(1000A_{40}=161.32\), \(\ddot a_{40}=14.8166\), \(1000A_{42}=176.36\), \(\ddot a_{42}=14.5510\), \(1000A_{46}=210.12\), \(\ddot a_{46}=13.9546\), \(q_{45}=0.004\). \(i=0.06\). \({}_3L\) is the prospective loss at time 3 using the contract premium. Calculate \(E({}_3L\mid K_{42}\ge3)\).`,o:['27','31','44','48','52'],a:1,s:R`Later premium \(=176.36/14.5510=12.1201\). \({}_4V=210.12-12.1201(13.9546)=40.99\). Early premium \(=161.32/14.8166=10.8878\). Recursion: \(({}_3V+10.8878)(1.06)=1000(0.004)+0.996(40.99)\), so \({}_3V=31.4\).`},
{t:T3,d:'Medium',q:R`Fully discrete whole life of 1000 on (40) with contract premium equal to the benefit premium. \(A\) is the loss on the one-year term insurance in the 11th year with benefit equal to the net amount at risk. ILT: \(\ddot a_{40}=14.8166\), \(\ddot a_{51}=13.0803\), \(q_{50}=0.00592\); \(i=0.06\). Calculate \(\mathrm{Var}(A\mid K_{40}\ge10)\).`,o:['3900','4000','4100','4200','4300'],a:2,s:R`\({}_{11}V=1000\big(1-\frac{13.0803}{14.8166}\big)=117.19\), so net amount at risk \(=882.81\). One-year loss takes two values: \(\mathrm{Var}=(882.81v)^2p_{50}q_{50}=882.81^2(0.99408)(0.00592)/1.06^2\approx4082\).`},
{t:T3,d:'Hard',q:R`Fully discrete 3-year endowment of 10,000 on (50): \(i=0.03\); \(1000q_{50}=8.32\); \(1000q_{51}=9.11\); \({}_1V=3209\); \({}_2V=6539\). \({}_0L\) is the loss at issue using the benefit premium. Calculate \(\mathrm{Var}({}_0L)\).`,o:['277,000','303,000','357,000','403,000','454,000'],a:4,s:R`\(\mathrm{Var}({}_2L\mid K\ge2)=0\). Hattendorff: \(\mathrm{Var}({}_1L\mid K\ge1)=\frac{(10000-6539)^2}{1.03^2}(0.99089)(0.00911)=101{,}923\). Then \(\mathrm{Var}({}_0L)=\frac{(10000-3209)^2}{1.03^2}(0.99168)(0.00832)+\frac{0.99168}{1.03^2}(101923)\approx358{,}665+95{,}272=453{,}937\).`},
{t:T3,d:'Medium',q:R`Fully discrete 3-year term of 1000 on (x), \(i=0.10\). For \(h=1,2,3\) the rate \(q_{x+h-1}\) and terminal reserve \({}_hV\) are: \(h=1\): 0.3, 95.833; \(h=2\): 0.4, 120.833; \(h=3\): 0.5, 0. \({}_1L\) is the prospective loss at time 1 using the benefit premium. Calculate \(\mathrm{Var}({}_1L\mid K_x\ge1)\).`,o:['238,000','247,000','256,000','265,000','274,000'],a:2,s:R`Year 3: \(\mathrm{Var}({}_2L\mid K\ge2)=\frac{1000^2(0.5)(0.5)}{1.1^2}=206{,}612\). Year 2: \(\mathrm{Var}({}_1L\mid K\ge1)=\frac{(1000-120.833)^2(0.4)(0.6)}{1.1^2}+\frac{0.6}{1.1^2}(206612)\approx153{,}309+102{,}452=255{,}761\).`},
{t:T4,d:'Medium',q:R`Special fully discrete 3-year endowment on (75): maturity value 1000; death benefit is 1000 plus the reserve at the end of the year of death. ILT: \(1000q_{75}=51.69\), \(1000q_{76}=56.47\), \(1000q_{77}=61.68\); \(i=0.05\). Calculate the level benefit premium.`,o:['321','339','356','364','373'],a:2,s:R`\({}_3V=1000\). Recursion with \(b_{h+1}={}_{h+1}V+1000\): \(1.05({}_hV+\pi)={}_{h+1}V+1000q_{75+h}\). Chaining the three years (multiply by \(1.05^{k}\), sum): \(\pi(1.05+1.05^2+1.05^3)=1061.68+1.05(56.47)+1.05^2(51.69)\approx1177.96\), so \(\pi=355.87\).`},
{t:T6,d:'Hard',q:R`Special fully discrete whole life on (40): death benefit 1000 for 20 years, 5000 for the next 5 years, 1000 thereafter; premium \(1000P_{40}\) for 20 years, \(5000P_{40}\) for the next 5 years, \(\pi\) thereafter. ILT, \(i=0.06\): \(1000A_{40}=161.32\), \({}_{20}E_{40}=0.27414\), \(1000A_{60}=369.13\), \(\ddot a_{40}=14.8166\), \(\ddot a_{60}=11.1454\), \(q_{60}=0.01376\). Calculate \({}_{21}V\).`,o:['255','259','263','267','271'],a:0,s:R`Avoid \(\pi\): use the retrospective approach at 20. APV benefits \(=161.32-0.27414(369.13)=60.127\). APV premiums \(=\frac{161.32}{14.8166}(14.8166-0.27414\cdot11.1454)=128.053\). So \({}_{20}V=\frac{128.053-60.127}{0.27414}=247.78\). Then \({}_{21}V=\frac{(247.78+5000P_{40})(1.06)-5000(0.01376)}{0.98624}\) with \(1000P_{40}=10.8878\): \({}_{21}V=255.1\).`},
{t:T6,d:'Hard',q:R`A 10-year deferred whole life annuity of 1 per year, payable continuously, on (35). Mortality follows De Moivre with \(\omega=85\); \(i=0\); level benefit premiums are payable continuously for 10 years. Calculate the benefit reserve at the end of five years.`,o:['9.38','9.67','10.00','10.36','10.54'],a:0,s:R`During deferral only premiums come in, so use the retrospective formula \({}_5V=\pi\bar a_{35:\overline{5}|}/{}_5E_{35}\). With \(i=0\): \(\bar a_{35:\overline{10}|}=9\), \(\bar a_{35:\overline{5}|}=4.75\), \({}_{10|}\bar a_{35}=16\), \({}_5E_{35}=0.9\). \(\pi=16/9\), so \({}_5V=\frac{(16/9)(4.75)}{0.9}=9.38\).`},
{t:T6,d:'Easy',q:R`\(P_x=0.090\), \({}_nV_x=0.563\), and the premium for an \(n\)-year pure endowment of 1 on (x) is 0.00864. Calculate the premium for an \(n\)-year term insurance of 1 on (x).`,o:['0.008','0.024','0.040','0.065','0.085'],a:4,s:R`Use \(P_x-P^1_{x:\overline{n}|}={}_nV_x\cdot P_{x:\overline{n}|}^{\;\;\,\mathrm{pure\ endowment}}\). So \(0.09-P^1_{x:\overline{n}|}=0.563(0.00864)=0.004864\), giving \(P^1_{x:\overline{n}|}=0.0851\).`},
{t:T6,d:'Easy',q:R`Fully discrete whole life of 25,000 on (25): \(P_{25}=0.01128\); the premium for a 15-year pure endowment of 1 is 0.05107; \(P_{25:\overline{15}|}=0.05332\) (15-year endowment). Calculate \(25{,}000\,{}_{15}V_{25}\).`,o:['4420','4460','4500','4540','4580'],a:0,s:R`Term premium \(=0.05332-0.05107=0.00225\). Use \(P_{25}-P^1_{25:\overline{15}|}={}_{15}V_{25}\times0.05107\): \(0.01128-0.00225=0.00903\), so \({}_{15}V_{25}=0.17682\) and \(25000\,{}_{15}V_{25}=4420\).`}
,
{t:U1,d:'Medium',q:R`Fully discrete whole life of 1000 on (50). Annual per-policy expense is 1, plus an additional first-year expense of 15. A claim settlement expense of 50 is paid with the claim. All other expenses are paid at the start of the year. Mortality follows De Moivre’s law with \(\omega=100\); \(i=0.05\). Calculate the level expense-loaded premium.`,o:['27','28','29','30','31'],a:4,s:R`Under De Moivre, \(_{k|}q_{50}=1/50\), so \(A_{50}=\frac{1-1.05^{-50}}{50(0.05)}=0.365119\) and \(\ddot a_{50}=\frac{1-A_{50}}{d}=13.3325\). Equivalence: \((G-1)\ddot a_{50}=15+1050A_{50}\), so \(G=1+\frac{398.375}{13.3325}=30.88\).`},
{t:U1,d:'Easy',q:R`Fully discrete whole life of 100,000 on (35). Expenses, all at the start of each year: 10% of premium, 25 per policy, and 2.50 per thousand of insurance. \(1000P_{35}=8.36\). Calculate the level expense-loaded premium.`,o:['930','1041','1142','1234','1352'],a:3,s:R`Divide the equivalence equation by \(\ddot a_{35}\): \(G=100{,}000P_{35}+0.1G+25+2.5(100)=836+0.1G+275\). So \(0.9G=1111\) and \(G=1234.44\).`},
{t:U1,d:'Hard',q:R`10-payment, fully discrete 20-year term of 1000 on (40); \(i=0.06\); ILT. Expenses at the start of each year: Year 1 — taxes 4% and sales commission 25% of premium, policy maintenance 10. Years 2+ — taxes 4% and commission 5% of premium, maintenance 5. Given: \(1000A^1_{40:\overline{20}|}=60.1267\), \(\ddot a_{40:\overline{10}|}=7.69671\), \(\ddot a_{40:\overline{20}|}=11.7612\). Calculate the expense-loaded premium.`,o:['18.21','18.35','18.53','18.71','18.95'],a:0,s:R`Premiums last 10 years, maintenance 20 years: \(G\ddot a_{10}=0.2G+5+0.09G\ddot a_{10}+5\ddot a_{20}+60.1267\). So \(G=\frac{65.1267+5(11.7612)}{0.91(7.69671)-0.2}=\frac{123.933}{6.804}=18.215\).`},
{t:U1,d:'Medium',q:R`Special single-premium 2-year endowment on (x): death benefits (end of year) \(b_1=3000\), \(b_2=2000\); maturity benefit 1000. Expenses at the start of each year: taxes 2% and commissions 3% of the expense-loaded premium, plus other expenses of 15 in year 1 and 2 in year 2. \(i=0.04\); \(p_x=0.9\), \(p_{x+1}=0.8\). Calculate the expense-loaded premium.`,o:['670','940','1000','1300','1370'],a:4,s:R`Death benefits: \(\frac{3000(0.1)}{1.04}+\frac{2000(0.9)(0.2)}{1.04^2}=621.30\). Survival: \(\frac{1000(0.72)}{1.04^2}=665.68\). Expenses: \(0.05G+15+\frac{2(0.9)}{1.04}=0.05G+16.73\). So \(G=0.05G+16.73+1286.98\), giving \(G=1372.3\).`},
{t:U1,d:'Medium',q:R`Fully discrete 15-payment whole life of 100,000 on (x): expense-loaded level premium 4669.95; \(100000A_x=51{,}481.97\); \(\ddot a_{x:\overline{15}|}=11.35\); \(d=0.02913\). Expenses at the start of the year: 10% of premium in year 1 and 2% thereafter; per-policy expenses \(K\) in year 1 and 5 each later year until death. Calculate \(K\).`,o:['10.0','16.5','23.0','29.5','36.5'],a:0,s:R`\(\ddot a_x=\frac{1-0.5148197}{0.02913}=16.655\). APV expenses \(=0.08G+0.02G\ddot a_{x:\overline{15}|}+(K-5)+5\ddot a_x=0.307G+K-5+83.27=1511.95+K\). Equivalence: \(11.35G=51481.97+1511.95+K\), so \(K=53004.9-52993.9=10.0\).`},
{t:U1,d:'Medium',q:R`Whole life with premiums at the start of each year and death benefit \(B\) paid at the moment of death. Expenses at the start of each year — first year: 30% of premium, 3.00 per 1000 of insurance, 150 per policy; renewal: 10% of premium, 0 per 1000, 50 per policy. \(\bar A_x=0.247\); \(\ddot a_x=13\). A level policy fee covers the per-policy expenses in the premium formula. Find the minimum face amount for which the policy fee does not exceed 50% of the expense-loaded premium.`,o:['2,650','3,000','3,450','5,300','6,000'],a:1,s:R`APV expenses \(=0.3G+0.003B+150+(0.1G+50)(12)=1.5G+750+0.003B\). Equivalence: \(13G=0.247B+1.5G+750+0.003B\), so \(G=\frac{B+3000}{46}\) and the policy fee is \(3000/46\). Requiring \(\frac{3000}{46}\le0.5\frac{B+3000}{46}\) gives \(B\ge3000\).`},
{t:U1,d:'Medium',q:R`Fully continuous whole life of 1 on (x). The expense-augmented loss is \(L_e=L+X\), where \(L=v^T-P(\bar A_x)\bar a_{\overline{T}|}\) and \(X=I+(g-e)\bar a_{\overline{T}|}\). Given \(\delta=0.05\), \(\bar a_x=12\), \(\mathrm{Var}(v^T)=0.1\), \(g=0.001\), \(e=0.0033\). Net and expense-loaded premiums use the equivalence principle. Calculate \(\mathrm{Var}(L_e)\).`,o:['0.252','0.263','0.278','0.293','0.300'],a:3,s:R`Using \(\bar a_{\overline{T}|}=(1-v^T)/\delta\), \(L_e\) is a constant plus \(\big(\frac{P+\delta}{\delta}-\frac{g-e}{\delta}\big)v^T\), with \(P+\delta=1/\bar a_x\). So \(\mathrm{Var}(L_e)=0.1\Big(\frac{1}{0.05(12)}+\frac{0.0023}{0.05}\Big)^2=0.1(1.7127)^2=0.2933\).`},
{t:U1,d:'Medium',q:R`Fully discrete whole life of 1000 on (60). Expenses at the start of the year: 20% of premium plus 8 in year 1; 6% of premium plus 2 in renewal years. The level expense-loaded premium is 41.20; \(i=0.05\). Calculate the expense-augmented loss \({}_0L_e\) if the insured dies in the third policy year.`,o:['770','790','810','830','850'],a:0,s:R`\(K=2\): benefit \(1000v^3=863.84\); first-year expenses \(0.2(41.2)+8=16.24\); renewal expenses \((0.06(41.2)+2)\,a_{\overline{2}|}=4.472(1.8594)=8.32\); premiums \(41.2\ddot a_{\overline{3}|}=41.2(2.8594)=117.80\). \(L_e=863.84+16.24+8.32-117.80=770.6\).`},
{t:U2,d:'Hard',q:R`Special 20-year term on (40): death benefit 10,000 at the moment of death; during year 5 the gross premium is 150 per year, paid continuously. Gompertz mortality \(\mu_x=Bc^x\) with \(B=0.00004\), \(c=1.1\); \(\delta=0.04\). Expenses: 5% of premium (continuous) and 100 at death. At the end of year 5 the expected PV of future losses is 1000. Using Euler’s method with step \(h=0.25\) backward from \(t=5\) in Thiele’s equation, calculate the expected PV of future losses at \(t=4.5\).`,o:['975','962','949','936','923'],a:4,s:R`Thiele: \(\frac{dV}{dt}=G(1-c)-e+(\delta+\mu_{40+t})V-(b+E)\mu_{40+t}\). At \(t=5\): \(\mu=0.0029156\), so \(\frac{dV}{dt}=142.5+0.0429156(1000)-10100(0.0029156)=155.97\) and \(V_{4.75}=1000-0.25(155.97)=961.0\). At \(t=4.75\): \(\mu=0.002847\), derivative \(=154.92\), so \(V_{4.5}=961.0-0.25(154.92)=922.3\).`},
{t:U2,d:'Medium',q:R`5-year warranty on a phone: pays 100 at the moment of breakage (once), or 100 at the end of 5 years if it has not broken. Premiums are paid continuously at 25 per year until breakage. \(\mu_t=0.02t\); \(\delta=0.05\). \(V_t\) is the gross premium reserve. Approximate \(V_4\) by Euler’s method with \(h=0.5\), using the derivatives of \(V_t\) at times 4.0 and 4.5 (stepping backward from \(V_5=100\)).`,o:['71.0','71.4','71.9','72.4','72.8'],a:4,s:R`Thiele: \(\frac{dV}{dt}=25+(0.05+0.02t)V-100(0.02t)\), with \(V_5=100\). At \(t=4.5\): \(\frac{100-V_{4.5}}{0.5}=16+0.14V_{4.5}\Rightarrow V_{4.5}=85.98\). At \(t=4\): \(\frac{85.98-V_4}{0.5}=17+0.13V_4\Rightarrow V_4=72.75\).`},
{t:U2,d:'Medium',q:R`Same warranty as above (breakage pays 100; 100 at year 5 if no breakage; premium rate 25; \(\mu_t=0.02t\); \(\delta=0.05\)). This time approximate \(V_4\) by Euler’s method with \(h=0.5\) using the derivatives of \(V_t\) at times 4.5 and 5.0.`,o:['71.05','71.44','71.93','72.42','72.81'],a:0,s:R`At \(t=5\): \(\frac{100-V_{4.5}}{0.5}=25-10+0.15(100)=30\Rightarrow V_{4.5}=85\). At \(t=4.5\): \(\frac{85-V_4}{0.5}=16+0.14(85)=27.9\Rightarrow V_4=71.05\).`},
{t:U3,d:'Medium',q:R`Fully discrete 3-year endowment of 1000 on (x). The expense-loaded premium is \(G=P+e\), where \(P\) is the net premium. Expenses at the start of each year: 18% of \(G\) plus 13 in year 1; 7% of \(G\) plus 5 in renewal years. The expense reserve two years after issue is \(-16.10\); \(G=342.86\). Calculate the net annual premium.`,o:['252.05','275.90','297.76','305.14','329.96'],a:2,s:R`The expense premium is \(e=G-P\). The expense reserve at time 3 is 0, so \((-16.10+e-0.07G-5)(1+i)=0\), giving \(e=16.10+24.00+5=45.10\). Hence \(P=342.86-45.10=297.76\).`},
{t:U3,d:'Hard',q:R`Fully discrete whole life of 1 on (55): \(A_{55}=0.305\), \(A_{65}=0.440\), \(1000q_{55}=6.5\), \(i=0.05\). Calculate \(1000\big({}_{10}V_{55}-{}_{10}V^{FPT}_{55}\big)\), the difference between the benefit reserve and the full preliminary term reserve at the end of year 10.`,o:['9','10','11','12','13'],a:4,s:R`\({}_{10}V_{55}=\frac{A_{65}-A_{55}}{1-A_{55}}=0.19424\). The FPT reserve at 10 is the benefit reserve at time 9 of a policy issued at 56: first find \(A_{56}\) from \(1.05A_{55}=q_{55}+p_{55}A_{56}\), so \(A_{56}=0.31580\). Then \({}_{10}V^{FPT}_{55}=\frac{0.44-0.31580}{1-0.31580}=0.18152\). Difference \(=0.01272\), i.e. \(12.7\).`},
{t:U4,d:'Medium',q:R`Pricing: continuous whole life of 1000 on (80), premium by the equivalence principle with \(\mu=0.15\) (constant) and \(i=0.06\). The supervisor believes the Illustrative Life Table with UDD is better (\(A_{80}=0.66575\)). Calculate the insurer’s expected loss at issue if the premium is unchanged and the supervisor is right.`,o:['−124','−26','0','37','220'],a:0,s:R`Premium rate \(=1000\mu=150\). Under the ILT with UDD: \(\bar A_{80}=\frac{i}{\delta}A_{80}=0.68553\) and \(\bar a_{80}=\frac{1-\bar A_{80}}{\delta}=5.3969\). Expected loss \(=685.53-150(5.3969)=-124.0\).`},
{t:U4,d:'Medium',q:R`Fully discrete whole life of 1000 on (60); benefit premium from: \(i=0.06\), \(q_{60}=0.01376\), \(1000A_{60}=369.33\), \(1000A_{61}=383.00\). One insured has first-year mortality ten times the rate used; all later rates are as originally assumed. Calculate this insured’s expected loss at issue, based on the original benefit premium.`,o:['72','86','100','114','128'],a:3,s:R`Premium \(=\frac{1000\,dA_{60}}{1-A_{60}}=\frac{369.33(0.06/1.06)}{0.63067}=33.148\). Revised \(A_{60}=v(0.1376+0.8624(0.383))=0.441414\), \(\ddot a_{60}=\frac{1-0.441414}{0.06/1.06}=9.8683\). Loss \(=441.41-33.148(9.8683)=114.3\).`},
{t:U4,d:'Medium',q:R`ABC prices a continuous life annuity of 1 per year on (x) at the single benefit premium using \(\delta=0.03\) and \(\mu_{x+t}=0.02\). A revised assumption has \(\mu_{x+t}=0.02\) for \(t<10\) and 0.01 for \(t\ge10\). Calculate the expected loss at issue under the revised assumption as a percentage of the contract premium.`,o:['2%','8%','15%','20%','23%'],a:2,s:R`Premium \(=\frac1{0.05}=20\). Revised: \(\bar a_x=\frac{1-e^{-0.5}}{0.05}+e^{-0.5}\frac1{0.04}=7.869+15.163=23.033\). Loss \(=\frac{23.033-20}{20}=15.2\%\).`},
{t:U4,d:'Hard',q:R`Fully discrete whole life of 1000 on (40); the contract premium is the level benefit premium at issue; \(d=0.05\). At issue: \(_{k|}q_{40}=0.02\), \(k=0,\dots,49\). At time 10 mortality is revised prospectively: \(_{k|}q_{50}=0.04\), \(k=0,\dots,24\). Calculate \(E({}_{10}L\mid K_{40}\ge10)\) under the revised assumption.`,o:['Less than 225','At least 225, but less than 250','At least 250, but less than 275','At least 275, but less than 300','At least 300'],a:4,s:R`Issue basis (\(v=0.95\)): \(A_{40}=0.02\,a_{\overline{50}|}=0.350761\), so \(1000P_{40}=\frac{1000dA_{40}}{1-A_{40}}=27.013\). Revised: \(A_{50}=0.04\,a_{\overline{25}|}=0.549184\), \(\ddot a_{50}=\frac{1-0.549184}{0.05}=9.0163\). Expected loss \(=549.18-27.013(9.0163)=305.6\).`},
{t:U5,d:'Medium',q:R`Gross annual premium \(G\) for a fully discrete whole life. No deaths or withdrawals are expected in the first two years; \(i=0.1\). Expenses at the start of each year: 7% of \(G\) plus 10 in year 1 and 2 in year 2. The expected asset share at the end of year 2 is 12.66. Calculate \(G\).`,o:['12.25','12.35','12.45','12.55','12.65'],a:3,s:R`\({}_1AS=(0.93G-10)(1.1)\) and \({}_2AS=({}_1AS+0.93G-2)(1.1)=12.66\). Hence \({}_1AS+0.93G-2=11.509\), i.e. \(1.1(0.93G-10)+0.93G-2=11.509\), so \(2.1(0.93G)=24.509\) and \(G=12.55\).`},
{t:U5,d:'Medium',q:R`Fully discrete whole life of 1000 on (x); death is the only decrement. Annual benefit premium 80; contract premium 100; year-1 expenses are 40% of the contract premium, paid at the start of the year; \(i=0.10\); \(1000\,{}_1V_x=40\). Calculate the asset share at the end of year 1.`,o:['17','18','19','20','21'],a:0,s:R`Recursion for the benefit reserve: \(80(1.1)=40+q(1000-40)\Rightarrow q=0.05\). Asset share: \({}_1AS=\frac{(0.6\times100)(1.1)-1000(0.05)}{0.95}=\frac{16}{0.95}=16.84\approx17\).`},
{t:U5,d:'Hard',q:R`Fully discrete 20-year term on (40), death benefit 10,000 at the end of the year of death. Year 4 values — gross annual premium 90 (both); expenses as % of premium: anticipated 3%, actual 2.5%; \(q_{43}\): anticipated 0.003, actual 0.002; interest: anticipated 5%, actual 4%. Gross premium reserves on the assumed basis: 100 at the end of year 3 and 125 at the end of year 4. 1000 policies were issued; 990 remain at the end of year 3. Calculate the total gain from mortality, interest and expenses in year 4.`,o:['8345','8385','8425','8465','8505'],a:1,s:R`Actual profit: assets \(990(100+90\times0.975)\times1.04=193{,}307\) less claims \(990(0.002)(10000)=19{,}800\) less reserves \(990(0.998)(125)=123{,}503\), i.e. \(50{,}005\). Expected profit: \(990[100+90(0.97)]1.05-990[0.003(10000)+0.997(125)]=41{,}620\). Gain \(=50{,}005-41{,}620=8385\).`},
{t:U5,d:'Hard',q:`${W} Calculate the gain from interest in year 10, with the interest gain calculated before any other source.`,o:['−112,000','−111,000','−110,000','−109,000','−120,280'],a:2,s:R`Single premium, so no cash flow at the start of year 10; interest is earned on the reserve. Gain \(=1000(0.05-0.06)(10{,}994.49)=-109{,}945\), closest to \(-110{,}000\).`},
{t:U5,d:'Medium',q:`${W} Calculate the gain from expenses in year 10, assuming the interest gain has been taken and the mortality gain has not.`,o:['−9,910','−9,900','−9,890','−9,880','−9,870'],a:1,s:R`Anticipated survivors \(=1000(0.99)=990\), and expenses are paid only for survivors. Gain \(=(50-60)(990)=-9900\).`},
{t:U5,d:'Hard',q:`${W} Calculate the gain from mortality in year 10, assuming the interest and expense gains have already been taken.`,o:['19,540','21,540','21,560','23,540','23,560'],a:4,s:R`From \(1.06\,{}_9V=0.99({}_{10}V+1000+50)\): \({}_{10}V=\frac{10994.49(1.06)}{0.99}-1050=10{,}721.88\). Each death (annuity ceases) saves the 1000 payment, the 60 actual expense and the reserve: \(1000+60+10{,}721.88=11{,}781.88\). Anticipated deaths 10, actual 12, so the gain is \(2(11{,}781.88)\approx23{,}560\).`}
,
{t:U2,d:'Medium',q:`${V4} Calculate the gross premium reserve at the end of year 1.`,o:['1,056','1,106','1,156','1,206','1,256'],a:2,s:R`At time 1 only year 2 remains: expense 2 at the start, death benefit 2000 with \(q_{x+1}=0.2\), maturity 1000 with probability 0.8. Recursion: \(({}_1V^g-2)(1.04)=2000(0.2)+1000(0.8)=1200\), so \({}_1V^g=1153.85+2=1155.85\).`},
{t:U2,d:'Hard',q:R`Using the 10-payment, 20-year term of 1000 on (40) with expense-loaded premium \(G=18.215\) (4% taxes + 5% commission = 9% of renewal premiums; 5 per year maintenance for 20 years; \(i=0.06\)), and given \(1000A^1_{49:\overline{11}|}=61.91\) and \(\ddot a_{49:\overline{11}|}=8.106\), calculate the gross premium reserve at the end of year 9.`,o:['79.4','82.1','85.9','88.6','91.3'],a:2,s:R`Remaining at time 9: benefits \(61.91\); maintenance \(5\ddot a_{49:\overline{11}|}=40.53\); only one premium remains (year 10), net of 9% expenses: \(0.91G=16.58\). So \({}_9V^g=61.91+40.53-16.58=85.86\).`},
{t:U2,d:'Medium',q:R`Evaluate \(\dfrac{d}{dt}\big[{}_tp_x\,v^t\,{}_t\bar V(\bar A_x)\big]\) for a fully continuous whole life of 1 with no expenses.`,o:[R`\({}_tp_xv^t\,\bar P(\bar A_x)\)`,R`\({}_tp_xv^t[\bar P(\bar A_x)+\delta]\)`,R`\({}_tp_xv^t[\bar P(\bar A_x)-\mu_{x+t}]\)`,R`\({}_tp_xv^t[\bar P(\bar A_x)+\delta-\mu_{x+t}]\)`,R`\({}_tp_xv^t[\bar P(\bar A_x)+\mu_{x+t}]\)`],a:2,s:R`Thiele: \(\frac{d}{dt}{}_t\bar V=\bar P+\delta\,{}_t\bar V-\mu_{x+t}(1-{}_t\bar V)\). Also \(\frac{d}{dt}({}_tp_xv^t)=-{}_tp_xv^t(\delta+\mu_{x+t})\). Product rule: \({}_tp_xv^t\big[\bar P+\delta V-\mu(1-V)-V(\delta+\mu)\big]={}_tp_xv^t[\bar P-\mu_{x+t}]\).`},
{t:U2,d:'Medium',q:R`Fully continuous 10-year term of 10,000 on (x), no expenses, premium rate 225 per year. Mortality is De Moivre with \(\omega-x=50\) (\(\mu_{x+t}=\frac1{50-t}\)); \(\delta=0.05\). The reserve satisfies \(\frac{d}{dt}{}_tV=225+\frac{70-t}{20(50-t)}{}_tV-\frac{10000}{50-t}\). Calculate \({}_0V\).`,o:['−34.37','−17.19','0','17.19','34.37'],a:0,s:R`The ODE is Thiele’s equation, so \({}_0V=10000A^1_{x:\overline{10}|}-225\bar a_{x:\overline{10}|}\). \(A^1_{x:\overline{10}|}=\int_0^{10}\frac{e^{-0.05t}}{50}dt=0.157388\); \(A_{x:\overline{10}|}=0.157388+0.8e^{-0.5}=0.642612\), so \(\bar a_{x:\overline{10}|}=\frac{1-0.642612}{0.05}=7.1478\). \({}_0V=1573.88-225(7.1478)=-34.37\).`},
{t:U2,d:'Hard',q:R`Same policy as the previous question (10-year term of 10,000, premium rate 225, De Moivre with \(\omega-x=50\), \(\delta=0.05\)). What is the probability that the insurer makes a profit?`,o:['0.2','0.4','0.6','0.8','0.9'],a:3,s:R`For \(0<T<10\): \(L=10000e^{-0.05T}-4500(1-e^{-0.05T})>0\iff T<23.4\), so any death in 10 years is a loss. For \(T\ge10\): \(L=-225\frac{1-e^{-0.5}}{0.05}<0\). Profit probability \(=\Pr(T\ge10)=\frac{40}{50}=0.8\).`},
{t:U2,d:'Hard',q:R`30-year deferred whole life annuity of 1000 per year (continuous) issued to (30). Premiums are paid continuously at constant rate \(P\) for 10 years (or until earlier death). \(\mu_x=\frac1{100-x}\); \(\delta=0.05\). Using the equivalence principle, calculate \(P\).`,o:['186.8','191.8','196.8','201.8','206.8'],a:2,s:R`Equivalence: \(P\bar a_{30:\overline{10}|}=1000\,{}_{30}E_{30}\bar a_{60}\). \({}_{30}E_{30}=\frac{40}{70}e^{-1.5}\). \(\bar a_{60}=\frac{1-\bar A_{60}}{0.05}=11.3534\) with \(\bar A_{60}=\frac{1-e^{-2}}{0.05(40)}=0.4323\) (De Moivre, 40 years left). \(\bar a_{30:\overline{10}|}=7.3539\). So \(P=\frac{1000(0.5714)(0.2231)(11.3534)}{7.3539}=196.8\).`},
{t:U2,d:'Medium',q:R`Whole life with continuous premiums and benefit paid at the moment of death. \(\mu_{45}=0.03\), \(\delta=0.04\). When \(\delta=0.04\): \(\bar P(\bar A_{30})=0.05\) and \(\bar P(\bar A_{45})=0.06\). Calculate the instantaneous rate of change of the benefit reserve at time 15 for a whole life of 1 issued to (30).`,o:['0.019','0.023','0.027','0.031','0.035'],a:2,s:R`\(\bar P(\bar A_{45})=\frac1{\bar a_{45}}-\delta\Rightarrow\bar a_{45}=\frac1{0.10}=10\), \(\bar A_{45}=1-0.04(10)=0.6\). \({}_{15}\bar V=\bar A_{45}-\bar P(\bar A_{30})\bar a_{45}=0.6-0.5=0.1\). Thiele: \(\frac{dV}{dt}=0.05+(0.04+0.03)(0.1)-0.03=0.027\).`},
{t:U3,d:'Medium',q:R`Fully discrete 3-year endowment of 1000 on (x); expense-loaded premium \(G=402.32\) by the equivalence principle; \(1000P_{x:\overline{3}|}=323.12\); \(q_x=q_{x+1}=1/8\); \(i=0.10\). Expenses at the start of the year: first year 30% of premium plus 8 per policy; renewal 10% of premium. Calculate the expense reserve at the end of year 1.`,o:['−40','−54','−62','−65','−71'],a:2,s:R`Expense premium \(=402.32-323.12=79.2\). The expense reserve at time 0 is 0 and no benefit is paid on death, so \((0+79.2-0.3G-8)(1.1)=p_x\,{}_1V^e=0.875\,{}_1V^e\). With \(0.3G+8=128.70\): \({}_1V^e=\frac{1.1(79.2-128.696)}{0.875}=-62.2\).`},
{t:U3,d:'Hard',q:R`Fully discrete 20-year endowment of 1 on (45); \(i=0.06\); \(1000q_{46}=4.24\); \(\ddot a_{47:\overline{18}|}=10.918\). Calculate \({}_2V^{FPT}_{45:\overline{20}|}\).`,o:['0.026','0.027','0.028','0.029','0.030'],a:4,s:R`The FPT reserve at time 2 equals the benefit reserve at time 1 of a 19-year endowment issued at age 46: \(1-\frac{\ddot a_{47:\overline{18}|}}{\ddot a_{46:\overline{19}|}}\). \(\ddot a_{46:\overline{19}|}=1+\frac{1-0.00424}{1.06}(10.918)=11.2563\). So the reserve \(=1-\frac{10.918}{11.2563}=0.03006\).`},
{t:U3,d:'Hard',q:R`Fully discrete whole life of 1000 on (50); \(i=0.06\); \(\ddot a_{52}=12.88785\); \(A^1_{51:\overline{1}|}=0.00606\). Calculate \(1000\,{}_2V^{FPT}_{50}\).`,o:['14.50','14.60','14.70','14.80','14.90'],a:2,s:R`The FPT reserve at time 2 equals the benefit reserve at time 1 of a whole life issued at 51: \(1-\ddot a_{52}/\ddot a_{51}\). \(q_{51}=0.00606(1.06)=0.0064236\), so \(\ddot a_{51}=1+\frac{0.9935764}{1.06}(12.88785)=13.0802\). Reserve \(=1-\frac{12.88785}{13.0802}=0.01471\), i.e. 14.71.`},
{t:U4,d:'Hard',q:R`Fully continuous whole life of 1000 on (35) with level premiums. Premium basis: \(\mu_x=\frac1{110-x}\), \(i=5\%\), initial expense 20% of annual premium. Reserve basis: \(\mu_x=\frac1{100-x}\), \(i=6\%\), initial expense 20% of annual premium, settlement expense 30 at death. Calculate the annual premium on the premium basis. (\(\bar A_{35}=0.266242\), \(\bar a_{35}=15.03906\) on that basis.)`,o:['15.9','16.9','17.9','18.9','19.9'],a:2,s:R`Equivalence: \(G\bar a_{35}=1000\bar A_{35}+0.2G\), so \(G=\frac{266.242}{15.03906-0.2}=17.94\).`},
{t:U2,d:'Hard',q:R`Same policy (whole life of 1000 on (35), reserve basis \(\mu_x=\frac1{100-x}\), \(i=6\%\), initial expense 20% of premium, settlement expense 30). The premium is set on the reserve basis by the equivalence principle (\(\bar A_{35}=0.258047\), \(\bar a_{35}=12.733258\); at age 55: \(\bar A_{55}=0.353667\), \(\bar a_{55}=11.092249\)). Calculate the gross premium reserve at the end of year 20.`,o:['118.9','129.0','139.2','149.7','160.1'],a:1,s:R`\(G=\frac{1030\bar A_{35}}{\bar a_{35}-0.2}=\frac{265.788}{12.5333}=21.2066\). Initial expense is gone by year 20: \({}_{20}V=1030\bar A_{55}-G\bar a_{55}=364.28-235.23=129.05\).`},
{t:U2,d:'Hard',q:R`Same policy and reserve basis as the previous question; \(G=21.2066\), \({}_{20}V=129.047\), \(\delta=\ln1.06\), \(\mu_{55}=\frac1{45}\), settlement expense 30 at death. Calculate \(\frac{d}{dt}{}_tV\) at \(t=20\).`,o:['6.9','7.8','8.7','9.6','10.5'],a:2,s:R`Thiele: \(\frac{dV}{dt}=G+\delta V-(b+E-V)\mu=21.2066+0.058269(129.047)-(1030-129.047)\frac1{45}=21.207+7.520-20.021=8.70\).`},
{t:U4,d:'Hard',q:R`20-year continuous endowment of 20,000 on (40), level continuous premiums. Premium basis: \(\mu_x=0.04\) (\(x<50\)), \(0.05\) (\(x>50\)); \(i=5\%\); expenses: 20% of annual premium plus 100 at issue, and 5% of annual premium continuously. Reserve basis: \(\mu_x=0.06\); \(i=4\%\); same expenses; premium from the premium basis (\(G=1291.509\)). Given \(\bar A_{52:\overline{8}|}=0.783437\) and \(\bar a_{52:\overline{8}|}=5.521640\) on the reserve basis, calculate the expense-augmented reserve at time 12.`,o:['8,420','8,650','8,894','9,130','9,360'],a:2,s:R`With maintenance of 5% of \(G\), net premium outflow is \(0.95G\). \({}_{12}V=20000\bar A_{52:\overline{8}|}-0.95G\bar a_{52:\overline{8}|}=15{,}668.7-0.95(1291.509)(5.52164)=8894\).`},
{t:U2,d:'Hard',q:R`Continue the previous question: \({}_{12}V=8894.06\), \(\delta=\ln1.04\), \(\mu=0.06\), death benefit 20,000, premium 1291.509 with 5% continuous maintenance expense. Calculate \(\frac{d}{dt}{}_tV\) at \(t=12\).`,o:['842.6','909.4','976.2','1,043.8','1,110.5'],a:1,s:R`Thiele: \(\frac{dV}{dt}=G(1-0.05)+\delta V-(b-V)\mu=0.95(1291.509)+0.039221(8894.06)-(20000-8894.06)(0.06)=1226.9+348.8-666.4=909.4\).`},
{t:U5,d:'Hard',q:`${V33} Decompose the gain in the order interest, then expenses, then mortality. Calculate the gain from expenses.`,o:['440.0','463.3','487.5','512.0','536.9'],a:1,s:R`After the interest step, the expense gain uses the actual interest rate of 4%: \(990(90)(0.03-0.025)(1.04)=463.32\).`},
{t:U5,d:'Hard',q:`${V33} Decompose the gain in the order mortality, then expenses, then interest. Calculate the gain from interest.`,o:['−1,931.0','−1,858.7','−1,854.3','−1,790.0','−1,720.0'],a:1,s:R`Interest comes last, so mortality and expenses are already at actual values: \(990\,[100+90(0.975)](0.04-0.05)=990(187.75)(-0.01)=-1858.7\).`}
,
{t:X1,d:'Medium',q:R`Double decrement table with \(\ell^{(\tau)}_{63}=500\) and: \(q^{(1)}_{63}=0.050\); \(q^{(2)}_{63}=0.500\); \({}_{1|}q^{(1)}_{63}=0.070\); \({}_{2|}q^{(1)}_{63}=0.042\); \({}_2q^{(2)}_{63}=0.600\); \(\ell^{(\tau)}_{66}=0\). Calculate \(d^{(2)}_{65}\).`,o:['100','105','109','114','119'],a:4,s:R`\(d^{(1)}_{63}=25\), \(d^{(2)}_{63}=250\), so \(\ell_{64}=225\). \(d^{(1)}_{64}=500(0.07)=35\), \(d^{(1)}_{65}=500(0.042)=21\). Two-year decrement-2 deaths: \(500(0.6)=300\), so \(d^{(2)}_{64}=50\). Then \(\ell_{65}=225-35-50=140\), and since \(\ell_{66}=0\): \(d^{(2)}_{65}=140-21=119\).`},
{t:X1,d:'Medium',q:R`Double decrement table. Age 30: \(q^{(\tau)}_{30}=0.075\), \(d^{(2)}_{30}=130\). Age 31: \(q^{(1)}_{31}=0.020\), \(q^{(2)}_{31}=0.050\), \(\ell^{(\tau)}_{31}=1850\). Age 32: \(d^{(1)}_{32}=54\). Calculate \({}_3q^{(1)}_{30}\).`,o:['0.0555','0.0577','0.0614','0.0656','0.0692'],a:0,s:R`\(\ell_{30}=\frac{1850}{1-0.075}=2000\). \(d^{(\tau)}_{30}=150\), so \(d^{(1)}_{30}=150-130=20\). \(d^{(1)}_{31}=1850(0.02)=37\). Then \({}_3q^{(1)}_{30}=\frac{20+37+54}{2000}=0.0555\).`},
{t:X2,d:'Medium',q:R`Double decrement for (40): \(\mu^{(1)}_{40+t}=\frac{2}{60+t}\) and \(\mu^{(2)}_{40+t}=\frac{3}{60+t}\), \(t\ge0\). \(T\) is the time until decrement and \(J\) the cause. Calculate \(\Pr(J=2)\).`,o:['0.33','0.40','0.50','0.60','0.67'],a:3,s:R`\({}_tp^{(\tau)}_{40}=\big(\frac{60}{60+t}\big)^5\). \(\Pr(J=2)=\int_0^\infty\big(\tfrac{60}{60+t}\big)^5\tfrac{3}{60+t}dt=3\cdot60^5\cdot\frac{1}{5\cdot60^5}=0.6\).`},
{t:X2,d:'Hard',q:R`Same model as above (\(\mu^{(1)}_{40+t}=\frac2{60+t}\), \(\mu^{(2)}_{40+t}=\frac3{60+t}\)). Calculate \(\Pr(J=1\mid T=10)\).`,o:['0.33','0.40','0.50','0.60','0.67'],a:1,s:R`\(f_{J\mid T}(1\mid t)=\frac{\mu^{(1)}_{40+t}}{\mu^{(\tau)}_{40+t}}=\frac{2/(60+t)}{5/(60+t)}=\frac25=0.40\), independent of \(t\).`},
{t:X2,d:'Medium',q:R`Students leave a college for failure (1) or all other reasons (2). 1000 students enter at \(t=0\). \(\mu^{(1)}_t=\mu\), \(0\le t\le4\); \(\mu^{(2)}_t=0.04\), \(0\le t\le4\). 48 students are expected to leave during the first year (all causes). Calculate the expected number leaving because of failure during the fourth year.`,o:['8','10','24','34','41'],a:0,s:R`\(1000\big(1-e^{-(\mu+0.04)}\big)=48\Rightarrow\mu+0.04=0.04919\Rightarrow\mu=0.00919\). Fourth year: \(1000\int_3^4e^{-0.04919t}(0.00919)dt=1000\cdot\frac{0.00919}{0.04919}\big(e^{-0.14757}-e^{-0.19676}\big)=7.74\).`},
{t:X2,d:'Medium',q:R`(50) is an employee of XYZ. Decrement 1 is retirement: \(\mu^{(1)}_{50+t}=0\) for \(0\le t<5\), \(0.02\) for \(t\ge5\). Decrement 2 is other termination: \(\mu^{(2)}_{50+t}=0.05\) for \(0\le t<5\), \(0.03\) for \(t\ge5\). Calculate the probability that (50) retires before age 60.`,o:['0.069','0.074','0.079','0.084','0.089'],a:0,s:R`Total force is 0.05 throughout, so \({}_tp^{(\tau)}=e^{-0.05t}\). Retirement only occurs after \(t=5\): \({}_{10}q^{(1)}_{50}=\int_5^{10}0.02e^{-0.05t}dt=0.4\big(e^{-0.25}-e^{-0.5}\big)=0.0689\).`},
{t:X2,d:'Easy',q:R`Double decrement model: \({}_tp'^{(1)}_{40}=1-\frac t{60}\) for \(0\le t\le60\) and \({}_tp'^{(2)}_{40}=1-\frac t{40}\) for \(0\le t\le40\). Find \(\mu^{(\tau)}_{60}\).`,o:['0.025','0.038','0.050','0.063','0.075'],a:4,s:R`\(\mu^{(1)}_{40+t}=\frac{1}{60-t}\), \(\mu^{(2)}_{40+t}=\frac1{40-t}\). At age 60, \(t=20\): \(\mu^{(\tau)}_{60}=\frac1{40}+\frac1{20}=0.075\).`},
{t:X2,d:'Medium',q:R`Don, age 50, is subject to two decrements. Decrement 1 is mortality, whose associated single decrement table follows De Moivre’s law with \(\omega=100\). Decrement 2 is leaving academic employment with \(\mu^{(2)}_{50+t}=0.05\), \(t\ge0\). Calculate the probability that Don remains an actuarial science professor for at least five but less than ten years.`,o:['0.22','0.25','0.28','0.31','0.34'],a:0,s:R`\({}_tp^{(\tau)}_{50}=\big(1-\frac t{50}\big)e^{-0.05t}\). Probability \(={}_5p^{(\tau)}-{}_{10}p^{(\tau)}=0.9e^{-0.25}-0.8e^{-0.5}=0.7009-0.4852=0.2157\).`},
{t:X3,d:'Hard',q:R`Double decrement table with \(\ell^{(\tau)}_{40}=2000\). Age 40: \(q^{(1)}_{40}=0.24\), \(q^{(2)}_{40}=0.10\), \(q'^{(1)}_{40}=0.25\), \(q'^{(2)}_{40}=y\). Age 41: \(q'^{(1)}_{41}=0.20\), \(q'^{(2)}_{41}=2y\). Calculate \(\ell^{(\tau)}_{42}\).`,o:['800','820','840','860','880'],a:0,s:R`\(p^{(\tau)}_{40}=1-0.24-0.10=0.66\) and also \(=p'^{(1)}p'^{(2)}=0.75(1-y)\), so \(y=0.12\). \(p^{(\tau)}_{41}=0.8(1-0.24)=0.608\). \(\ell_{42}=2000(0.66)(0.608)=802.6\), i.e. 800.`},
{t:X3,d:'Medium',q:R`Double decrement table: \(\ell^{(\tau)}_{30}=1000\); \(q'^{(1)}_{30}=0.1\); \(q'^{(2)}_{30}=0.3\); \({}_{1|}q^{(2)}_{30}=0.075\); \(\ell^{(\tau)}_{32}=472\). Calculate \(q^{(1)}_{31}\).`,o:['0.11','0.13','0.14','0.15','0.17'],a:1,s:R`\(p^{(\tau)}_{30}=(0.9)(0.7)=0.63\), so \(\ell_{31}=630\). \(d^{(2)}_{31}=1000(0.075)=75\). \(d^{(\tau)}_{31}=630-472=158\), so \(d^{(1)}_{31}=83\). \(q^{(1)}_{31}=\frac{83}{630}=0.132\).`},
{t:X3,d:'Easy',q:R`Death (d) and withdrawal (w). Associated single decrement rates for ages \(x+t\): \(t=0\): \(q'^{(d)}=0.002\), \(q'^{(w)}=0.15\); \(t=1\): 0.002, 0.05; \(t=2\): 0.002, 0.04. Calculate the probability that decrement occurs in the second year, \({}_{1|}q^{(\tau)}_x\).`,o:['0.022','0.036','0.044','0.051','0.073'],a:2,s:R`\(p^{(\tau)}_x=(0.998)(0.85)=0.8483\); \(p^{(\tau)}_{x+1}=(0.998)(0.95)=0.9481\). \({}_{1|}q^{(\tau)}_x=0.8483(1-0.9481)=0.0440\).`},
{t:X4,d:'Easy',q:R`Triple decrement table; each decrement is uniformly distributed over each year of age in its associated single decrement table. \(q'^{(1)}_x=0.2\), \(q'^{(2)}_x=0.08\), \(q'^{(3)}_x=0.125\). Calculate \(q^{(1)}_x\).`,o:['0.177','0.180','0.183','0.186','0.189'],a:1,s:R`Under SUDD: \(q^{(1)}_x=q'^{(1)}\big[1-\tfrac12(q'^{(2)}+q'^{(3)})+\tfrac13q'^{(2)}q'^{(3)}\big]=0.2\big[1-0.1025+0.003333\big]=0.18017\).`},
{t:X4,d:'Medium',q:R`Double decrement table in which both decrements are uniformly distributed over each year of age in their associated single decrement tables. \(\mu^{(1)}_{x+0.5}=\frac{2}{199}\) and \(q^{(2)}_x=0.01\). Calculate \(1000\,q^{(1)}_x\).`,o:['9.95','10.00','10.05','10.10','10.15'],a:0,s:R`SUDD gives \(\mu^{(1)}_{x+0.5}=\frac{q'^{(1)}}{1-0.5q'^{(1)}}=\frac2{199}\Rightarrow q'^{(1)}=0.01\). Also \(q^{(2)}=q'^{(2)}(1-0.5q'^{(1)})=0.01\Rightarrow q'^{(2)}=0.010050\). Then \(q^{(1)}=0.01(1-0.5\times0.01005)=0.0099497\), i.e. 9.95.`},
{t:X4,d:'Medium',q:R`Double decrement table with \(\ell^{(\tau)}_{60}=1000\) and \(d^{(1)}_{60}=81\). Each decrement is uniformly distributed over each year of age in its associated single decrement table, and \(q'^{(2)}_{60}=0.20\). Calculate \(\mu^{(1)}_{60.5}\).`,o:['0.082','0.087','0.090','0.094','0.098'],a:3,s:R`\(q^{(1)}_{60}=0.081=q'^{(1)}(1-0.5(0.20))\Rightarrow q'^{(1)}=0.09\). Under SUDD, \(\mu^{(1)}_{60.5}=\frac{q'^{(1)}}{1-0.5q'^{(1)}}=\frac{0.09}{0.955}=0.0942\).`},
{t:X4,d:'Hard',q:R`You hire 200 employees for a training program. Associated single decrement data: of 40 hires, those who fail to make adequate progress in years 1–3 number 10, 6, 8; of 30 hires, those who resign in years 1–3 number 6, 8, 2; of 20 hires, those who leave for other reasons in years 1–3 number 2, 2, 4. Use uniform distribution of decrements in the multiple decrement table in each year. Calculate the expected number who fail to make adequate progress in the third year.`,o:['4','8','12','14','17'],a:3,s:R`Single decrement survival probabilities \((p'^{(1)},p'^{(2)},p'^{(3)})\): yr 1: 0.75, 0.8, 0.9; yr 2: 0.8, \(\tfrac23\), \(\tfrac89\); yr 3: \(\tfrac23\), 0.875, 0.75. \(p^{(\tau)}_1=0.54\), \(p^{(\tau)}_2=0.474074\), \(p^{(\tau)}_3=0.4375\). Under MUDD, \(p'^{(1)}=(p^{(\tau)})^{q^{(1)}/q^{(\tau)}}\): \(\tfrac23=0.4375^{q^{(1)}_3/0.5625}\Rightarrow q^{(1)}_3=0.275892\). Expected failures \(=200(0.54)(0.474074)(0.275892)=14.13\).`},
{t:X4,d:'Medium',q:R`Double decrement table: \(\ell^{(\tau)}_{35}=1000\) and \(d^{(\tau)}_{35}=80\); at age 36, \(d^{(2)}_{36}=69\); \(\ell^{(\tau)}_{37}=828\). Each decrement is uniformly distributed over each year of age in the double decrement table. Calculate the absolute rate of decrement due to cause 1 at age 36.`,o:['0.026','0.050','0.064','0.080','0.100'],a:0,s:R`\(\ell_{36}=920\), so \(d^{(1)}_{36}=920-828-69=23\). \(q^{(\tau)}_{36}=0.1\), \(\frac{q^{(1)}}{q^{(\tau)}}=\frac{23}{92}=0.25\). \(p^{(\tau)}=0.9\), so \(p'^{(1)}=0.9^{0.25}=0.9740\) and \(q'^{(1)}_{36}=0.0260\).`},
{t:X4,d:'Medium',q:R`Double decrement table: age 40: \(\ell^{(\tau)}=1000\), \(d^{(1)}=60\), \(d^{(2)}=55\); age 41: \(d^{(2)}=70\); age 42: \(\ell^{(\tau)}=750\). Each decrement is uniformly distributed over each year of age in the double decrement table. Calculate \(q'^{(1)}_{41}\).`,o:['0.077','0.078','0.079','0.080','0.081'],a:0,s:R`\(\ell_{41}=885\), \(d^{(1)}_{41}=885-750-70=65\). \(\frac{q^{(1)}}{q^{(\tau)}}=\frac{65}{135}=0.48148\); \(p^{(\tau)}_{41}=\frac{750}{885}=0.847458\). \(p'^{(1)}=0.847458^{0.48148}=0.923401\), so \(q'^{(1)}_{41}=0.0766\).`},
{t:X4,d:'Hard',q:R`1000 lives age 60 are subject to death (1), disability (2) and retirement (3). Absolute rates of decrement \((q'^{(1)},q'^{(2)},q'^{(3)})\): age 60: 0.010, 0.030, 0.100; age 61: 0.013, 0.050, 0.200. Decrements are uniformly distributed over each year of age in the multiple decrement table. Calculate the expected number who retire before age 62.`,o:['248','254','260','266','272'],a:3,s:R`Age 60: \(p^{(\tau)}=0.99(0.97)(0.9)=0.86427\); \(0.9=0.86427^{q^{(3)}/0.13573}\Rightarrow q^{(3)}_{60}=0.09804\). Age 61: \(p^{(\tau)}=0.987(0.95)(0.8)=0.75012\); \(q^{(3)}_{61}=0.19393\). \(\ell_{61}=864.27\). Expected retirees \(=98.04+864.27(0.19393)=265.6\).`},
{t:X4,d:'Medium',q:R`\(q'^{(1)}_x=0.15\) and \(q'^{(2)}_x=0.21\). Each decrement is uniformly distributed over each year of age in its associated single decrement table. Calculate \({}_{0.1|0.5}q^{(1)}_x\), the probability of decrement 1 between times 0.1 and 0.6.`,o:['0.0670','0.0695','0.0708','0.0722','0.0750'],a:1,s:R`Density of decrement 1: \({}_tp^{(\tau)}\mu^{(1)}_{x+t}={}_tp'^{(2)}q'^{(1)}=(1-0.21t)(0.15)\). \(\int_{0.1}^{0.6}0.15(1-0.21t)dt=0.15[0.5-0.105(0.35)]=0.0695\).`},
{t:X4,d:'Hard',q:R`\(q'^{(1)}_x=0.15\) and \(q'^{(2)}_x=0.21\). Each decrement is uniformly distributed over each year of age in the double decrement table (MUDD). Calculate \({}_{0.1|0.5}q^{(1)}_x\).`,o:['0.0670','0.0695','0.0708','0.0722','0.0750'],a:0,s:R`\(q^{(\tau)}=1-0.85(0.79)=0.3285\). \(\frac{q^{(1)}}{q^{(\tau)}}=\frac{\ln0.85}{\ln0.6715}\), so \(q^{(1)}_x=0.134058\). Under MUDD, \({}_tq^{(1)}=t\,q^{(1)}_x\), so the probability is \(0.5(0.134058)=0.0670\).`},
{t:X5,d:'Medium',q:R`\(q'^{(1)}_x=0.15\) and \(q'^{(2)}_x=0.21\). Each force of decrement is constant over the year of age. Calculate \({}_{0.1|0.5}q^{(1)}_x\).`,o:['0.0670','0.0695','0.0708','0.0722','0.0750'],a:2,s:R`\(\mu^{(1)}=-\ln0.85=0.162519\), \(\mu^{(2)}=-\ln0.79=0.235722\), \(\mu^{(\tau)}=0.398241\). \({}_{0.1|0.5}q^{(1)}=\frac{\mu^{(1)}}{\mu^{(\tau)}}\big(e^{-0.1\mu^{(\tau)}}-e^{-0.6\mu^{(\tau)}}\big)=0.4081(0.96096-0.78760)=0.0708\).`},
{t:X5,d:'Hard',q:R`Triple decrement; each decrement has a constant force over each year of age. At age 64 the single decrement rates \((q'^{(1)},q'^{(2)},q'^{(3)})\) are \((0.025,0.035,0.200)\). At age 65, \(q^{(1)}_{65}=0.02716\). Calculate \({}_2q^{(1)}_{64}\).`,o:['0.04182','0.04248','0.04314','0.04480','0.04546'],a:1,s:R`\(p^{(\tau)}_{64}=0.975(0.965)(0.8)=0.7527\). Partition: \(0.975=0.7527^{q^{(1)}_{64}/0.2473}\Rightarrow q^{(1)}_{64}=0.022039\). \({}_2q^{(1)}_{64}=q^{(1)}_{64}+p^{(\tau)}_{64}q^{(1)}_{65}=0.022039+0.7527(0.02716)=0.04248\).`},
{t:X5,d:'Hard',q:R`Constant forces of decrement in each year of age, double decrement: \(q'^{(1)}_x=0.10\); \(q'^{(2)}_{x+1}=0.25\); \(\mu^{(2)}_{x+t}=0.20\) for \(0\le t<1\); \(\mu^{(1)}_{x+1+t}=0.15\) for \(0\le t<1\). Calculate \({}_{1|}q^{(2)}_x\).`,o:['0.169','0.172','0.175','0.178','0.181'],a:1,s:R`\(p^{(\tau)}_x=0.9e^{-0.2}\). Year 2: \(p^{(\tau)}_{x+1}=e^{-0.15}(0.75)=0.645531\); \(0.75=0.645531^{q^{(2)}_{x+1}/0.354469}\Rightarrow q^{(2)}_{x+1}=0.232987\). So \({}_{1|}q^{(2)}_x=0.9e^{-0.2}(0.232987)=0.1717\).`},
{t:X6,d:'Medium',q:R`Death (d) and withdrawal (w). Withdrawals occur once a year, three-fourths of the way through the year of age. Deaths are uniformly distributed over each year in the associated single decrement table. \(\ell^{(\tau)}_x=1000\); \(q'^{(w)}_x=0.2\); \(\ell^{(\tau)}_{x+1}=720\). Calculate \(d^{(d)}_x\).`,o:['83','86','90','93','95'],a:4,s:R`\(p^{(\tau)}_x=0.72=p'^{(w)}p'^{(d)}=0.8p'^{(d)}\Rightarrow p'^{(d)}=0.9\), \(q'^{(d)}=0.1\). Withdrawal at \(t=\frac34\): \(q^{(w)}_x={}_{3/4}p'^{(d)}(0.2)=(1-0.075)(0.2)=0.185\). So \(d^{(w)}=185\) and \(d^{(d)}=1000-720-185=95\).`},
{t:X6,d:'Easy',q:R`Death (1), disability (2), withdrawal (3). \(q'^{(1)}_x=0.010\), \(q'^{(2)}_x=0.050\), \(q'^{(3)}_x=0.100\). Withdrawals occur only at the end of the year. Mortality and disability are uniformly distributed over each year of age in their associated single decrement tables. Calculate \(q^{(3)}_x\).`,o:['0.088','0.091','0.094','0.097','0.100'],a:2,s:R`Withdrawal happens at \(t=1\) (a single jump), so both other decrements must have been survived: \(q^{(3)}_x=p'^{(1)}p'^{(2)}q'^{(3)}=0.99(0.95)(0.1)=0.09405\).`},
{t:X6,d:'Medium',q:R`Double decrement model. For cause (1), \(q'^{(1)}_x=0.100\) with decrements uniformly distributed over the year. For cause (2), \(q'^{(2)}_x=0.125\) and all decrements occur at time 0.7. Calculate \(q^{(2)}_x\).`,o:['0.114','0.115','0.116','0.117','0.118'],a:2,s:R`Cause 2 occurs only at \(t=0.7\), so \(q^{(2)}_x={}_{0.7}p'^{(1)}\times0.125=(1-0.1\times0.7)(0.125)=0.11625\).`},
{t:X6,d:'Hard',q:R`Cause 1 is death and cause 2 is withdrawal. Deaths are uniformly distributed over each year of age in the single decrement table. Withdrawals occur only at the end of each year of age. \(\ell^{(\tau)}_x=1000\); \(q^{(2)}_x=0.40\); \(d^{(1)}_x=0.45\,d^{(2)}_x\). Calculate \(p'^{(2)}_x\).`,o:['0.51','0.53','0.55','0.57','0.59'],a:0,s:R`\(d^{(2)}=400\) so \(d^{(1)}=180\) and \(q^{(1)}_x=0.18\). Withdrawal is at the end of the year, so \(q^{(1)}_x=q'^{(1)}_x=0.18\). Also \(q^{(2)}_x=p'^{(1)}q'^{(2)}=0.82\,q'^{(2)}=0.40\Rightarrow q'^{(2)}=\frac{20}{41}\). Hence \(p'^{(2)}_x=\frac{21}{41}=0.512\).`},
{t:X6,d:'Hard',q:R`Double decrement table. Cause 1: uniform over the year in its single decrement table. Cause 2: decrements occur at only two points: three-quarters at time \(\tfrac15\) and one-quarter at time \(\tfrac35\). \(q'^{(1)}_x=0.10\) and \(q'^{(2)}_x=0.12\). Calculate \(q^{(2)}_x\).`,o:['0.108','0.110','0.112','0.114','0.116'],a:4,s:R`Cause 2 has two jumps: \(0.12\times\tfrac34=0.09\) at 0.2 and \(0.03\) at 0.6. \(q^{(2)}_x=(1-0.2\times0.1)(0.09)+(1-0.6\times0.1)(0.03)=0.0882+0.0282=0.1164\).`}
,
{t:Y1,d:'Medium',q:R`XYZ Paper Mill buys a 5-year special insurance for machine breakdown. A “minor” cause (1) pays 2000 at the moment of breakdown; a “major” cause (2) pays 500,000 at the moment of breakdown. Once a benefit is paid, the contract ends. \(\mu^{(1)}_t=0.100\), \(\mu^{(2)}_t=0.004\) for \(t>0\); \(\delta=0.04\). Calculate the actuarial present value of this insurance.`,o:['7840','7880','7920','7960','8000'],a:0,s:R`Total force \(0.104\), so \(\mu^{(\tau)}+\delta=0.144\). APV \(=\int_0^5e^{-0.04t}e^{-0.104t}(2000(0.1)+500000(0.004))dt=2200\cdot\frac{1-e^{-0.72}}{0.144}=7841.3\).`},
{t:Y1,d:'Easy',q:R`Special whole life of 100,000 payable at the moment of death of (x), with a double-indemnity provision paying an extra 100,000 for death by accidental means during the first ten years. \(\mu^{(\tau)}_{x+t}=0.001\); \(\mu^{(1)}_{x+t}=0.0002\) is the force of death by accidental means; \(\delta=0.06\). Calculate the single benefit premium.`,o:['1640','1710','1790','1870','1970'],a:2,s:R`Basic benefit: \(100000\cdot\frac{0.001}{0.061}=1639.34\). Accident top-up: \(100000(0.0002)\frac{1-e^{-0.61}}{0.061}=149.7\). Total \(=1789.1\).`},
{t:Y1,d:'Medium',q:R`Whole life paying, at the moment of death: 1,000,000 for accidental death as an airplane passenger (cause 1), 500,000 for other accidental death (cause 2), 250,000 for non-accidental death (cause 3). Constant forces: \(\mu^{(1)}=\frac1{2{,}000{,}000}\), \(\mu^{(2)}=\frac1{250{,}000}\), \(\mu^{(3)}=\frac1{10{,}000}\); \(\delta=0.06\). Calculate the single benefit premium.`,o:['450','460','470','480','490'],a:1,s:R`\(\mu^{(\tau)}=0.0001045\). APV \(=\frac{\sum b_j\mu^{(j)}}{\mu^{(\tau)}+\delta}=\frac{0.5+2+25}{0.0601045}=457.5\), closest to 460.`},
{t:Y1,d:'Easy',q:R`Special fully continuous whole life on (x) with a double decrement model. Death benefit is 3 for cause 1 and 1 for cause 2. \(\mu^{(1)}_{x+t}=0.02\), \(\mu^{(2)}_{x+t}=0.04\); the force of interest \(\delta\) is a positive constant. Calculate the benefit premium.`,o:['0.07','0.08','0.09','0.10','0.11'],a:3,s:R`APV of benefits \(=\frac{3(0.02)+0.04}{0.06+\delta}=\frac{0.1}{0.06+\delta}\) and \(\bar a=\frac1{0.06+\delta}\) (premiums stop at death from either cause). So \(P=0.1\).`},
{t:Y1,d:'Hard',q:R`Special whole life with benefits at the moment of death: accidental death 50,000 in all years; non-accidental death in the first 2 years returns the single benefit premium (no interest); non-accidental death after year 2 pays 50,000. \(\mu^{(1)}_{x+t}=0.01\) (accidental); \(\mu^{(2)}_{x+t}=2.29\) (non-accidental); \(\delta=0.1\). Calculate the single benefit premium.`,o:['1,000','4,000','7,000','11,000','15,000'],a:3,s:R`Total force \(2.30\), plus \(\delta\): \(2.4\). \(P=50000\frac{0.01}{2.4}+P\frac{2.29}{2.4}(1-e^{-4.8})+50000\frac{2.29}{2.4}e^{-4.8}\). So \(P(1-0.94631)=208.33+392.6=600.96\), giving \(P=11{,}194\).`},
{t:Y1,d:'Medium',q:R`3-year fully discrete term insurance of 1000 on (40), double decrement (1 = death, 2 = withdrawal, no withdrawal benefit). Table: age 40: \(\ell^{(\tau)}=2000\), \(d^{(1)}=20\), \(d^{(2)}=60\); age 41: \(d^{(1)}=30\), \(d^{(2)}=50\); age 42: \(d^{(1)}=40\). \(i=0.05\). Calculate the level annual benefit premium.`,o:['14.3','14.7','15.1','15.5','15.7'],a:1,s:R`\(\ell_{41}=1920\), \(\ell_{42}=1840\). \(\ddot a=1+\frac{1920}{2000(1.05)}+\frac{1840}{2000(1.05)^2}=2.74875\). \(A^1=\frac{20}{2000(1.05)}+\frac{30}{2000(1.05)^2}+\frac{40}{2000(1.05)^3}=0.040406\). \(P=\frac{1000(0.040406)}{2.74875}=14.70\).`},
{t:Y2,d:'Medium',q:R`Fully discrete 4-year term on (40), double decrement. Benefit is 2000 for decrement 1 and 1000 for decrement 2. Extract: age 41: \(\ell^{(\tau)}=800\), \(d^{(1)}=8\), \(d^{(2)}=16\); ages 42 and 43: \(d^{(1)}=8\), \(d^{(2)}=16\). \(v=0.95\); the benefit premium is 34. Calculate \({}_2V\), the benefit reserve at the end of year 2.`,o:['8','9','10','11','12'],a:3,s:R`\(\ell_{42}=776\), \(\ell_{43}=752\). APV benefits at time 2: \(\frac{2000(8)+1000(16)}{776}(v+v^2)=\frac{32000}{776}(0.95+0.95^2)=76.39\). APV premiums \(=34\big(1+\frac{752}{776}(0.95)\big)=65.30\). \({}_2V=76.39-65.30=11.09\).`},
{t:Y2,d:'Hard',q:R`Special fully discrete 3-year term on (55), double decrement: decrement 1 is accidental death, decrement 2 is other death. Rates \((q^{(1)},q^{(2)})\): age 55: (0.002, 0.020); age 56: (0.005, 0.040); age 57: (0.008, 0.060). \(i=0.06\). Death benefit is 2000 for accidental and 1000 for other deaths. Level annual contract premium is 50. \({}_1L\) is the prospective loss at time 1 using the contract premium. Calculate \(E[{}_1L\mid K(55)\ge1]\).`,o:['5','9','13','17','20'],a:3,s:R`\(p^{(\tau)}_{56}=0.955\). APV future premiums \(=50\big(1+\frac{0.955}{1.06}\big)=95.05\). APV benefits \(=2000\big(\frac{0.005}{1.06}+\frac{0.955(0.008)}{1.06^2}\big)+1000\big(\frac{0.04}{1.06}+\frac{0.955(0.06)}{1.06^2}\big)=23.03+88.73=111.77\). Expected loss \(=111.77-95.05=16.72\).`},
{t:Y2,d:'Hard',q:R`Fully continuous whole life on (x), double decrement: benefit 2000 for accidental death (1) and 1000 for other death (2). Initial expense 50; settlement expenses 5% of the benefit at the moment of death; maintenance expenses 3 per year (continuous); contract premium 100 per year (continuous). \(\mu^{(1)}_{x+t}=0.004\), \(\mu^{(2)}_{x+t}=0.040\); \(\delta=0.05\). Calculate the actuarial present value at issue of the expense-augmented loss.`,o:['−446','−223','0','223','446'],a:0,s:R`\(\mu^{(\tau)}+\delta=0.094\). Benefits plus settlement expenses: \(1.05\,\frac{2000(0.004)+1000(0.04)}{0.094}=536.17\). Premium net of maintenance: \(\frac{100-3}{0.094}=1031.91\). Loss \(=536.17+50-1031.91=-445.7\).`},
{t:Y3,d:'Hard',q:R`Fully discrete whole life of 1000 on (70). Withdrawal benefit in year 10 is 110; gross annual premium 16; expenses at the start of the year; withdrawals occur at the end of the year; 1000 policies in force at the start of year 10. Assumed: \(q^{(d)}_{79}=0.01\), \(q'^{(w)}_{79}=0.1\), \(i=0.06\), expenses 3 per policy. Actual: 15 deaths, 100 withdrawals, \(i=0.05\), expenses 5 per policy. Reserves are gross premium reserves; the reserve at the end of year 9 is 115. Calculate the combined gain from mortality and withdrawals in year 10, taken before interest and expenses.`,o:['−4,360','−4,340','−4,320','−4,300','−4,280'],a:1,s:R`Withdrawal is at year-end, so \(q^{(d)}=0.01\) and \(q^{(w)}=0.99\times0.1=0.099\); \(p^{(\tau)}=0.891\). Recursion: \((16-3+115)(1.06)=0.891\,{}_{10}V+10+0.099(110)\), so \({}_{10}V=128.83\). Survivors \(=885\). Gain \(=-(1000-128.83)(15-10)-(110-128.83)(100-99)=-4355.9+18.8=-4337\), closest to \(-4340\).`},
{t:Y4,d:'Medium',q:R`Fully discrete 25-payment, 50-year endowment of 1000 on (30). \(A_{30:\overline{25}|}=0.39118\), \(A_{30:\overline{50}|}=0.28571\), \(A_{45:\overline{35}|}=0.36364\), \(A_{45:\overline{10}|}=0.64269\). After 15 years the policy is surrendered for a reduced paid-up endowment (maturing at year 50). The surrender charge is 20% of the benefit reserve. Calculate the reduced paid-up amount.`,o:['351','391','431','471','511'],a:2,s:R`Premium \(=1000\frac{A_{30:\overline{50}|}}{\ddot a_{30:\overline{25}|}}\). Reserve at 15 \(=1000A_{45:\overline{35}|}-P\ddot a_{45:\overline{10}|}=363.64-285.71\frac{1-0.64269}{1-0.39118}=195.96\). Cash value \(=0.8(195.96)=156.77\). Paid-up amount \(=156.77/0.36364=431.1\).`},
{t:Y4,d:'Medium',q:R`Fully discrete whole life of 1 on (x): \(P_x=0.060\), \(P_{x+10}=0.085\), \({}_{10}CV=0.9\,{}_{10}V_x\). Calculate the amount of reduced paid-up insurance purchased by the cash value at age \(x+10\).`,o:['0.235','0.265','0.294','0.324','0.350'],a:1,s:R`Reduced paid-up amount \(=\frac{{}_{10}CV}{A_{x+10}}\). Since \({}_{10}V=A_{x+10}\big(1-\frac{P_x}{P_{x+10}}\big)\), the amount is \(0.9\big(1-\frac{0.060}{0.085}\big)=0.2647\).`},
{t:Y4,d:'Hard',q:R`Fully discrete 20-year endowment of 10,000 on (45), in force 15 years. ILT, \(i=0.06\): \(1000A_{60}=369.13\), \(1000A_{65}=439.80\), \({}_5E_{60}=0.68756\), \(\ddot a_{60}=11.1454\), \(\ddot a_{65}=9.8969\), \(\ddot a_{45}=14.1121\), \({}_{20}E_{45}=0.25634\). Premiums were by the equivalence principle. When premiums stop after 15 years, the death benefit stays 10,000 but the pure endowment value is reduced so that the expected prospective loss at 60 is unchanged. Calculate the reduced pure endowment value.`,o:['8120','8500','8880','9260','9640'],a:0,s:R`Reserve at 15 \(=10000\big(1-\frac{\ddot a_{60:\overline5|}}{\ddot a_{45:\overline{20}|}}\big)=10000\Big(1-\frac{11.1454-0.68756(9.8969)}{14.1121-0.25634(9.8969)}\Big)=6249.99\). With reduced pure endowment \(S\): APV \(=10000A^1_{60:\overline5|}+{}_5E_{60}S=667.41+0.68756S\). Setting equal: \(S=8119.4\).`},
{t:Y4,d:'Hard',q:R`An individual aged 30 buys a fully continuous 20-year endowment of 10,000. At the end of 10 years the policy is surrendered for extended term insurance plus a pure endowment at the original maturity date. \(\bar A_{40:\overline{10}|}=0.565\); \({}_{10}E_{40}=0.537\); \(\bar P(\bar A_{30:\overline{20}|})=0.027\); \(\delta=0.06\). Cash values equal the net premium reserve. The outstanding policy loan at the end of 10 years is 2,000. Calculate the amount of the pure endowment.`,o:['0','2630','2735','6355','6875'],a:2,s:R`Reserve \(=10000\big[\bar A_{40:\overline{10}|}-\bar P\,\bar a_{40:\overline{10}|}\big]=10000\Big(0.565-0.027\frac{1-0.565}{0.06}\Big)=3692.5\). Net cash value \(=3692.5-2000=1692.5\). Term insurance amount \(=10000-2000=8000\) with \(\bar A^1_{40:\overline{10}|}=0.565-0.537=0.028\). \(1692.5=8000(0.028)+0.537S\), so \(S=2734.6\).`},
{t:Y5,d:'Medium',q:R`Fully discrete whole life of 10,000 on (40). Gross premium 90; renewal expenses are 5% of premium at the start of the year; at age 55: \(q^{(d)}=0.004\), \(q^{(w)}=0.050\); \(i=0.08\). Asset shares: \({}_{15}AS=1150\), \({}_{16}AS=1320\). Calculate \({}_{16}CV\), the cash value payable on withdrawal at the end of year 16.`,o:['810','860','910','960','1010'],a:2,s:R`\(p^{(\tau)}=1-0.004-0.05=0.946\). \(({}_{15}AS+90(0.95))(1.08)=0.004(10000)+0.05\,{}_{16}CV+0.946\,{}_{16}AS\). \((1235.5)(1.08)=1334.34=40+0.05CV+1248.72\Rightarrow{}_{16}CV=912.4\).`},
{t:Y5,d:'Medium',q:R`Fully discrete insurance of 1000 on (x): \({}_4AS=396.63\), \({}_5AS=694.50\), \(G=281.77\), \({}_5CV=572.12\), year-4 expenses are \(c_4=0.05\) of premium plus \(e_4=7.0\) per policy; \(q^{(d)}=0.09\), \(q^{(w)}=0.26\) (withdrawal at the end of the year). Calculate \(i\).`,o:['0.050','0.055','0.060','0.065','0.070'],a:0,s:R`\(({}_4AS+G(1-c_4)-e_4)(1+i)=q^{(d)}(1000)+q^{(w)}\,{}_5CV+p^{(\tau)}\,{}_5AS\). Left base: \(396.63+267.68-7=657.31\). Right: \(90+148.75+451.43=690.18\). So \(1+i=1.05\).`},
{t:Y5,d:'Hard',q:R`Fully discrete whole life of 1000 on (40); death and withdrawal only; mortality from the ILT (\(q_{40}=0.00278\), \(q_{41}=0.00298\), \(\ddot a_{40}=14.8166\), \(\ddot a_{41}=14.6864\)); \(i=0.06\). Withdrawal probability is 0.2 at the end of year 1 and zero afterwards. Expenses at the start of each year: 10% of premium plus 1.50 per 1000 insurance. The cash value at the end of year 1 is one-third of the benefit reserve \({}_1V_{40}\) (death only) for the 1000 policy. \({}_2AS=24\). Calculate the level gross premium \(G\).`,o:['15.4','15.8','16.3','16.7','17.2'],a:1,s:R`\({}_1V_{40}=1000\big(1-\frac{14.6864}{14.8166}\big)=8.7874\), so \({}_1CV=2.929\). Let \(R=0.1G+1.5\). Year 1: \((G-R)(1.06)=0.79722\,{}_1AS+0.00278(1000)+0.2(2.929)\). Year 2 (death only): \(({}_1AS+G-R)(1.06)=0.99702(24)+0.00298(1000)\). Subtracting: \(1.06\,{}_1AS=0.99702(24)-0.79722\,{}_1AS+2.98-2.78-0.586\), so \({}_1AS=12.676\) and \(G-R=12.709\). Then \(0.9G-1.5=12.709\Rightarrow G=15.79\).`}
,
{t:Z1,d:'Medium',q:R`Special 3-year insurance on a high-risk individual (x). States: 1 active, 2 disabled, 3 withdrawn, 4 dead. Annual transition probabilities for \(k=0,1,2\), rows = from-state, columns = to-state (1, 2, 3, 4): from 1: 0.4, 0.2, 0.3, 0.1; from 2: 0.2, 0.5, 0.0, 0.3; states 3 and 4 are absorbing. Death benefit is 1000, paid at the end of the year of death; \(i=0.05\). The insured is disabled (state 2) at the beginning of year 2. Calculate the expected present value of the prospective death benefits at the beginning of year 2.`,o:['440','528','634','712','803'],a:0,s:R`At \(t=1\) two years remain. \(\Pr(\text{dead at end of next year})=0.3\). The insured dies at the end of year 3 for the first time via \(2\to2\to4\) or \(2\to1\to4\): \(0.5(0.3)+0.2(0.1)=0.17\). EPV \(=1000\Big(\frac{0.3}{1.05}+\frac{0.17}{1.05^2}\Big)=439.9\).`},
{t:Z1,d:'Medium',q:R`Special 3-year term on (x). States: active (0), disabled (1), dead (2). Annual transition probabilities for each year: from 0: 0.8, 0.1, 0.1; from 1: 0.1, 0.7, 0.2; from 2: absorbing. A 100,000 benefit is paid at the end of the year of death. Premiums are paid at the start of each year when active, and none when disabled. \(d=0.10\). Calculate the level annual benefit premium.`,o:['9,000','10,700','11,800','13,200','20,800'],a:1,s:R`\(v=0.9\). Premium probabilities: \(\Pr(\text{active at }0)=1\); \(\Pr(\text{active at }1)=0.8\); \(\Pr(\text{active at }2)=0.8^2+0.1(0.1)=0.65\). APV premiums \(=P(1+0.8v+0.65v^2)=2.2465P\). Death probabilities by year: 0.1; \(0.8(0.1)+0.1(0.2)=0.1\); and \(0.095\). APV benefits \(=100000(0.1v+0.1v^2+0.095v^3)=24025.5\). \(P=\frac{24025.5}{2.2465}=10{,}695\).`},
{t:Z1,d:'Medium',q:R`Markov model for an insured population: states healthy (0), sick (1), terminated (2). Annual transition probabilities (rows from, columns to): from 0: 0.7, 0.1, 0.2; from 1: 0.3, 0.6, 0.1; state 2 absorbing. Mean annual healthcare cost: healthy 500, sick 3000, terminated 0. Transitions occur at the end of the year; \(i=0\). A contract premium of 800 is paid each year by an insured not terminated. Calculate the expected value of premiums less healthcare costs over the first 3 years for a new healthy insured.`,o:['−390','−200','−20','160','340'],a:3,s:R`Premium years: \(800(1+0.8+0.65)=1960\). Healthy-state costs: \(500[1+0.7+(0.7^2+0.1\times0.3)]=500(2.22)=1110\). Sick-state costs: \(3000[0+0.1+(0.7\times0.1+0.1\times0.6)]=3000(0.23)=690\). Net \(=1960-1110-690=160\).`},
{t:Z1,d:'Easy',q:R`Double decrement table: \(\ell_{30}=1000\), \(\ell_{31}=940\), \(\ell_{32}=888\), \(\ell_{33}=844\), \(\ell_{34}=809\); at age 32: \(d^{(1)}_{32}=3\), \(d^{(2)}_{32}=41\), \(d^{(\tau)}_{32}=44\). Kira models this with states 0 (alive), 1 (decrement 1), 2 (decrement 2), with annual transition probabilities taken from the table. Calculate \(p^{00}_{32}+p^{01}_{32}+p^{10}_{32}+p^{11}_{32}\).`,o:['1.904','1.929','1.954','1.979','2.004'],a:2,s:R`\(p^{00}_{32}=\frac{844}{888}=0.95045\), \(p^{01}_{32}=\frac{3}{888}=0.00338\), \(p^{11}_{32}=1\), \(p^{10}_{32}=0\). Sum \(=1.95383\).`},
{t:Z2,d:'Medium',q:R`Double decrement table: age 56: \(q^{(1)}=0.002\), \(q^{(2)}=0.020\); age 57: \(q^{(1)}=0.004\), \(q^{(2)}=0.060\). Both decrements are uniformly distributed over each year of age in the double decrement table. Calculate \(\mu^{01}_{56.4}\).`,o:['0.00198','0.00200','0.00202','0.00204','0.00206'],a:2,s:R`Under MUDD, \({}_{0.4}p^{(\tau)}_{56}=1-0.4(0.022)=0.9912\) and \(\mu^{01}_{56.4}=\frac{q^{(1)}_{56}}{{}_{0.4}p^{(\tau)}_{56}}=\frac{0.002}{0.9912}=0.002018\).`},
{t:Z2,d:'Hard',q:R`Same double decrement table (age 56: \(q^{(1)}=0.002\), \(q^{(2)}=0.020\); age 57: \(q^{(1)}=0.004\), \(q^{(2)}=0.060\)) with both decrements uniformly distributed over each year of age in the double decrement table. Calculate \({}_1p^{00}_{56.4}\).`,o:['0.9414','0.9514','0.9614','0.9714','0.9814'],a:2,s:R`Split the year: \({}_1p^{00}_{56.4}={}_{0.6}p^{00}_{56.4}\,{}_{0.4}p^{00}_{57}\). \({}_{0.4}p_{56}\,{}_{0.6}p_{56.4}=p_{56}\Rightarrow{}_{0.6}p^{00}_{56.4}=\frac{0.978}{0.9912}=0.9866828\). \({}_{0.4}p^{00}_{57}=1-0.4(0.064)=0.9744\). Product \(=0.961424\).`},
{t:Z2,d:'Easy',q:R`Four-state model (states 0, 1, 2, 3): the only possible transitions are \(0\to1\), \(0\to2\), \(0\to3\), with \(\mu^{01}_{x+t}=0.3\), \(\mu^{02}_{x+t}=0.5\), \(\mu^{03}_{x+t}=0.7\) for \(t\ge0\). Calculate \({}_1p^{02}_x\).`,o:['0.26','0.30','0.33','0.36','0.39'],a:0,s:R`Constant forces with total \(1.5\): \({}_1p^{02}_x=\frac{0.5}{1.5}\big(1-e^{-1.5}\big)=\frac13(0.77687)=0.2590\).`},
{t:Z3,d:'Medium',q:R`Permanent disability model: state 0 healthy, state 1 disabled, state 2 dead. \(\mu^{01}_x=0.02\), \(\mu^{02}_x=0.04\), \(\mu^{12}_x=0.05\) for \(x\ge0\). For a person healthy at age 50, calculate the probability he is healthy at age 60.`,o:['0.3012','0.4512','0.5488','0.6988','0.8452'],a:2,s:R`Total exit rate from state 0 is \(0.06\), and state 0 cannot be re-entered: \({}_{10}p^{00}_{50}=e^{-0.6}=0.5488\).`},
{t:Z3,d:'Hard',q:R`Same permanent disability model (\(\mu^{01}=0.02\), \(\mu^{02}=0.04\), \(\mu^{12}=0.05\)). For a person healthy at age 50, calculate the probability that he cannot survive to age 60.`,o:['0.0350','0.3008','0.3358','0.4512','0.5488'],a:2,s:R`\({}_{10}p^{01}_{50}=\int_0^{10}e^{-0.06t}(0.02)e^{-0.05(10-t)}dt=2e^{-0.5}(1-e^{-0.1})=0.1154\). Then \({}_{10}p^{02}_{50}=1-0.5488-0.1154=0.3358\).`},
{t:Z3,d:'Hard',q:R`Same model (\(\mu^{01}=0.02\), \(\mu^{02}=0.04\), \(\mu^{12}=0.05\)). For a person healthy at age 50, calculate the probability that he dies before age 60 and is not disabled immediately before he dies.`,o:['0.0350','0.3008','0.3358','0.4512','0.5488'],a:1,s:R`He must die directly from state 0: \(\int_0^{10}{}_tp^{00}_{50}\mu^{02}dt=\int_0^{10}0.04e^{-0.06t}dt=\frac23(1-e^{-0.6})=0.3008\).`},
{t:Z3,d:'Hard',q:R`Same model (\(\mu^{01}=0.02\), \(\mu^{02}=0.04\), \(\mu^{12}=0.05\)). For a person healthy at age 50, calculate the probability that he dies before age 60 and is disabled immediately before he dies.`,o:['0.0350','0.3008','0.3358','0.4512','0.5488'],a:0,s:R`Total death probability \(0.3358\) minus death directly from healthy \(0.3008\): \(0.03496\approx0.0350\).`},
{t:Z3,d:'Hard',q:R`Three states 0, 1, 2; the only transitions are \(0\to1\), \(0\to2\), \(1\to2\). \(\mu^{01}_x=0.03\) for \(x\le55\) and \(0.04\) for \(55<x\le60\); \(\mu^{02}_x=0.02\); \(\mu^{12}_x=0.1\) for \(x\ge0\). Calculate \({}_{15}p^{01}_{45}\), the probability that a person in state 0 at 45 is in state 1 at 60.`,o:['0.1483','0.1683','0.1883','0.2083','0.2283'],a:1,s:R`Chapman–Kolmogorov at 55: \({}_{15}p^{01}_{45}={}_{10}p^{00}_{45}{}_5p^{01}_{55}+{}_{10}p^{01}_{45}{}_5p^{11}_{55}\). \({}_{10}p^{00}_{45}=e^{-0.5}\); \({}_5p^{11}_{55}=e^{-0.5}\); \({}_5p^{01}_{55}=e^{-0.5}(e^{0.2}-1)\); \({}_{10}p^{01}_{45}=0.6e^{-1}(e^{0.5}-1)\). Sum \(=0.0814495+0.0868496=0.1683\).`},
{t:Z3,d:'Medium',q:R`Same three-state model: \(\mu^{01}_x=0.03\) for \(x\le55\), \(0.04\) for \(55<x\le60\); \(\mu^{02}_x=0.02\); \(\mu^{12}_x=0.1\). Calculate the expected time for a person in state 0 at age 45 to leave state 0 (take \(\mu^{01}_x=0.04\) for all \(x>55\)).`,o:['16.98','17.48','17.98','18.48','18.98'],a:2,s:R`\({}_tp^{00}_{45}=e^{-0.05t}\) for \(t\le10\) and \(e^{-0.5}e^{-0.06(t-10)}\) after. Expected time \(=\int_0^\infty{}_tp^{00}dt=\frac{1-e^{-0.5}}{0.05}+\frac{e^{-0.5}}{0.06}=7.869+10.109=17.98\).`},
