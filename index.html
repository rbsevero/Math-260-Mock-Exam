{t:Z3,d:'Hard',q:R`Permanent disability model, \(\mu^{12}_x=\mu^{02}_x=5\times10^{-5}e^{0.15x}\). A person is permanently disabled at age 40. Calculate the probability that he dies within 15 years.`,o:['0.5806','0.6806','0.7806','0.3194','0.1194'],a:1,s:R`Survival in state 1: \({}_{15}p^{11}_{40}=\exp\Big(-\int_0^{15}5\times10^{-5}e^{0.15(40+t)}dt\Big)=\exp\Big(-5\times10^{-5}\tfrac{e^{6}(e^{2.25}-1)}{0.15}\Big)=0.3193719\). Probability of death \(=1-0.3194=0.6806\).`},
{t:Z3,d:'Hard',q:R`Permanent disability model: \(\mu^{01}_x=5\times10^{-6}e^{0.2x}\), \(\mu^{02}_x=6\times10^{-5}e^{0.15x}\), \(\mu^{12}_x=1.1\,\mu^{02}_x\). Calculate \({}_8p^{00}_{35}\).`,o:['0.7218','0.7518','0.7818','0.8118','0.8418'],a:1,s:R`\({}_8p^{00}_{35}=\exp\Big(-\int_0^8(\mu^{01}_{35+t}+\mu^{02}_{35+t})dt\Big)=\exp\Big(-\tfrac{5\times10^{-6}e^{7}(e^{1.6}-1)}{0.2}-\tfrac{6\times10^{-5}e^{5.25}(e^{1.2}-1)}{0.15}\Big)=\exp(-0.108376-0.176854)=0.7518\).`},
{t:Z4,d:'Medium',q:R`Same permanent disability model as the previous question (\(\mu^{01}_x=5\times10^{-6}e^{0.2x}\), \(\mu^{02}_x=6\times10^{-5}e^{0.15x}\), \(\mu^{12}_x=1.1\mu^{02}_x\)). The integrand \({}_sp^{00}_{35}\,\mu^{01}_{35+s}\,{}_{8-s}p^{11}_{35+s}\) has values 0.00451382, 0.00666137, 0.00977483, 0.01422016, 0.02041873 at \(s=0,2,4,6,8\). Use the trapezium rule with 4 subintervals to estimate \({}_8p^{01}_{35}\).`,o:['0.0853','0.0862','0.0871','0.0889','0.0900'],a:1,s:R`Trapezium: \(\frac{2}{2}\big[f_0+2(f_2+f_4+f_6)+f_8\big]=0.00451382+2(0.03065636)+0.02041873=0.0862453\).`},
{t:Z4,d:'Medium',q:R`Using the same integrand values (0.00451382, 0.00666137, 0.00977483, 0.01422016, 0.02041873 at \(s=0,2,4,6,8\)), estimate \({}_8p^{01}_{35}\) with Simpson’s rule using 4 subintervals.`,o:['0.0853','0.0862','0.0871','0.0889','0.0900'],a:0,s:R`Simpson: \(\frac{2}{3}\big[f_0+4f_2+2f_4+4f_6+f_8\big]=\frac23\big[0.00451382+0.02664548+0.01954966+0.05688064+0.02041873\big]=0.0853389\).`},
{t:Z5,d:'Hard',q:R`Disability income model: state 0 healthy, state 1 disabled, state 2 dead. \(\mu^{01}=0.04\), \(\mu^{02}=0.02\), \(\mu^{12}=0.07\) (no recovery); \(\delta=0.10\). A healthy life aged \(x\) buys a policy paying 600 per year, continuously, for at most 3 months from each disablement, while disabled and alive. Calculate the actuarial present value at issue.`,o:['30.7','33.7','36.7','39.7','42.7'],a:2,s:R`Value at disablement of the 3-month annuity: \(600\frac{1-e^{-(0.07+0.1)(0.25)}}{0.17}=146.857\), independent of the time of disablement. Density of disablement discounted: \(\int_0^\infty e^{-0.1t}e^{-0.06t}(0.04)dt=\frac{0.04}{0.16}=0.25\). APV \(=146.857(0.25)=36.71\).`},
{t:Z5,d:'Hard',q:R`Same disability model (\(\mu^{01}=0.04\), \(\mu^{02}=0.02\), \(\mu^{12}=0.07\), \(\delta=0.10\)). A policy pays a lump sum of 50 three months after disablement, provided the insured is still disabled (alive) at that time. Calculate the actuarial present value at issue for a healthy life.`,o:['9.98','10.98','11.98','12.98','13.98'],a:2,s:R`Density of payment at time \(t>\tfrac14\): \({}_{t-1/4}p^{00}\mu^{01}\,{}_{1/4}p^{11}=0.04e^{-0.06(t-1/4)}e^{-0.07/4}=0.04e^{-0.06t-0.0025}\). APV \(=50\int_{1/4}^\infty e^{-0.1t}(0.04)e^{-0.06t-0.0025}dt=2e^{-0.0025}\frac{e^{-0.04}}{0.16}=11.98\).`}
,
{t:W1,d:'Easy',q:R`For independent lives (x) and (y): \(q_x=0.05\), \(q_y=0.09\); deaths are uniformly distributed over each year of age. Calculate \({}_{0.6}q_{xy}\), the probability that at least one of the two dies within 0.6 years.`,o:['0.0624','0.0824','0.0924','0.1124','0.1424'],a:1,s:R`\({}_{0.6}p_x=1-0.6(0.05)=0.97\) and \({}_{0.6}p_y=1-0.6(0.09)=0.946\). \({}_{0.6}p_{xy}=0.97(0.946)=0.91762\), so \({}_{0.6}q_{xy}=0.0824\).`},
{t:W1,d:'Medium',q:R`Mortality follows De Moivre’s law with \(\omega=105\). (45) and (65) have independent future lifetimes. Calculate \(\mathring e_{\overline{45:65}}\), the expected time until the last death.`,o:['33','34','35','36','37'],a:1,s:R`\(E[T_{45}]=30\), \(E[T_{65}]=20\). The joint-life time has maximum \(\min(60,40)=40\): \(E[T_{45:65}]=\frac{40}{2}-\frac{40^2}{6(60)}=15.56\). Last survivor: \(30+20-15.56=34.44\), closest to 34.`},
{t:W1,d:'Hard',q:R`Male survival: \(S(x)=1-\frac{x}{75}\), \(0\le x\le75\). Female mortality follows De Moivre’s law. At age 60 the female force of mortality is 60% of the male force. A male age 65 and a female age 60 have independent lifetimes. Calculate the expected time until the second death.`,o:['4.33','5.63','7.23','11.88','13.17'],a:4,s:R`Male force at 60: \(\frac1{15}\). Female: \(\frac1{\omega-60}=0.6\cdot\frac1{15}\Rightarrow\omega=85\). \(E[T_{65}]=5\), \(E[T_{60}]=12.5\). Joint-life maximum \(=\min(10,25)=10\): \(E[T_{65:60}]=\frac{10}{2}-\frac{10^2}{6(25)}=4.33\). Last survivor \(=5+12.5-4.33=13.17\).`},
{t:W1,d:'Medium',q:R`Mortality follows De Moivre’s law. (i) \(\mathring e_{\overline{40:40}}=3\,\mathring e_{\overline{60:60}}\); (ii) \(\mathring e_{\overline{20:20}}=k\,\mathring e_{\overline{60:60}}\). Calculate \(k\).`,o:['3.0','3.5','4.0','4.5','5.0'],a:4,s:R`For equal ages, \(\mathring e_{\overline{xx}}=\frac{2(\omega-x)}{3}\). (i) gives \(\omega-40=3(\omega-60)\Rightarrow\omega=70\). (ii): \(k=\frac{\omega-20}{\omega-60}=\frac{50}{10}=5\).`},
{t:W1,d:'Hard',q:R`Non-smokers have a force of mortality equal to one half that of smokers. For non-smokers, \(\ell_x=500(110-x)\), \(0\le x\le110\). Calculate \(\mathring e_{20:25}\), the expected time until the first death, for a smoker (20) and a non-smoker (25) with independent future lifetimes.`,o:['18.3','20.4','22.1','24.5','26.8'],a:2,s:R`Non-smoker survival at 25: \(1-\frac{t}{85}\). Smoker survival at 20 is the square of the non-smoker’s: \(\big(1-\frac t{90}\big)^2\). \(\mathring e_{20:25}=\int_0^{85}\big(1-\tfrac t{90}\big)^2\big(1-\tfrac t{85}\big)dt=22.06\).`},
{t:W1,d:'Medium',q:R`\(T_x\) and \(T_y\) are independent. \(E(T_x)=E(T_y)=4.0\) and \(\mathrm{Cov}(T_{xy},T_{\overline{xy}})=0.09\). Calculate \(E(T_{xy})\).`,o:['2.0','2.8','3.7','4.0','4.3'],a:2,s:R`\(\mathrm{Cov}(T_{xy},T_{\overline{xy}})=\mathrm{Cov}(T_x,T_y)+[E(T_x)-E(T_{xy})][E(T_y)-E(T_{xy})]\). With independence: \(0.09=[4-E(T_{xy})]^2\), so \(E(T_{xy})=3.7\).`},
{t:W2,d:'Hard',q:R`For independent lives (35) and (45): \({}_5p_{35}=0.90\); \({}_5p_{45}=0.80\); \(q_{40}=0.03\); \(q_{50}=0.05\). Calculate the probability that the last death of (35) and (45) occurs in the 6th year.`,o:['0.0095','0.0105','0.0115','0.0125','0.0135'],a:1,s:R`\({}_{5|1}q_{\overline{35:45}}={}_{5|1}q_{35}+{}_{5|1}q_{45}-{}_{5|1}q_{35:45}=0.9(0.03)+0.8(0.05)-0.72\big(1-0.97\times0.95\big)=0.067-0.72(0.0785)=0.01048\).`},
{t:W2,d:'Hard',q:R`(80) and (84) have independent lifetimes. \(p_{80}=0.50\), \(p_{81}=0.40\), \(p_{82}=0.60\), \(p_{83}=0.25\), \(p_{84}=0.20\), \(p_{85}=0.15\), \(p_{86}=0.10\). Calculate the change in the value of \({}_{2|1}q_{\overline{80:84}}\) if \(p_{82}\) is decreased from 0.60 to 0.30.`,o:['0.03','0.06','0.10','0.16','0.19'],a:1,s:R`\({}_{2|1}q_{\overline{80:84}}={}_{2|1}q_{80}+{}_{2|1}q_{84}-{}_{2|1}q_{80:84}\). Rearranged as in the manual, this equals \(0.194+{}_{2|1}q_{84}-0.1994\,p_{82}\). Decreasing \(p_{82}\) by 0.30 raises the value by \(0.1994(0.30)=0.0598\approx0.06\).`},
{t:W2,d:'Medium',q:R`Future lifetimes of (40) and (50) are independent. The survival function for (40) has constant force \(\mu=0.05\); (50) follows De Moivre’s law with \(\omega=110\). Calculate the probability that (50) dies within 10 years and dies before (40).`,o:['10%','13%','16%','19%','25%'],a:1,s:R`Condition on (50), density \(\frac1{60}\) on \((0,60)\): \(\int_0^{10}\frac1{60}e^{-0.05t}dt=\frac{1-e^{-0.5}}{60(0.05)}=0.1312\).`},
{t:W2,d:'Medium',q:R`(x) is subject to a uniform distribution of deaths over each year of age; (y) has constant force of mortality 0.3; \(T_x\) and \(T_y\) are independent; the probability that (x) dies first within one year is \(\Pr(T_x<T_y\text{ and }T_x<1)=0.045\). Calculate \(q_x\).`,o:['0.052','0.065','0.104','0.214','0.266'],a:0,s:R`Condition on \(T_x\) (density \(q_x\) on \((0,1)\)): \(q^{\;1}_{xy}=q_x\int_0^1e^{-0.3t}dt=q_x\frac{1-e^{-0.3}}{0.3}=0.8639\,q_x=0.045\Rightarrow q_x=0.0522\).`},
{t:W2,d:'Easy',q:R`Mortality follows De Moivre’s law with \(\omega=80\). (60) and (70) have independent lifetimes. Calculate the probability that (70) dies before (60).`,o:['0.55','0.60','0.65','0.70','0.75'],a:4,s:R`\(T_{60}\sim U(0,20)\), \(T_{70}\sim U(0,10)\), independent. \(\Pr(T_{70}<T_{60})=1-\Pr(T_{60}<T_{70})=1-\frac{0.5(10)^2}{20\times10}=0.75\).`},
{t:W2,d:'Medium',q:R`Mortality follows De Moivre’s law with \(\omega=100\); \(T_{80}\) and \(T_{85}\) are independent. \(G\) is the probability that (80) dies after (85) and before 5 years from now. \(H\) is the probability that the first death occurs after 5 and before 10 years from now. Calculate \(G+H\).`,o:['41/144','7/24','1/3','53/144','3/8'],a:4,s:R`\((T_{80},T_{85})\) is uniform on \([0,20]\times[0,15]\) (area 300). \(G=\frac{0.5(5)^2}{300}=\frac1{24}\). \(H\): both survive 5 but not both 10, so the region has area \(15\times10-10\times5=100\) and \(H=\frac13\). \(G+H=\frac1{24}+\frac13=\frac38\).`},
{t:W3,d:'Hard',q:R`Special fully continuous whole life of 1 on the last survivor of (x) and (y). \(T_x\) and \(T_y\) independent; \(\mu_{x+t}=\mu_{y+t}=0.07\); \(\delta=0.05\). Premiums are payable until the first death. Calculate the level annual benefit premium.`,o:['0.04','0.07','0.08','0.10','0.14'],a:2,s:R`\(\mu_{xy}=0.14\): \(\bar A_{xy}=\frac{0.14}{0.19}=0.7368\), \(\bar A_x=\bar A_y=\frac{0.07}{0.12}=0.5833\), so \(\bar A_{\overline{xy}}=2(0.5833)-0.7368=0.4298\). \(\bar a_{xy}=\frac{1-0.7368}{0.05}=5.263\). Premium \(=\frac{0.4298}{5.263}=0.0817\), closest to 0.08.`},
{t:W3,d:'Hard',q:R`Last-survivor insurance of 10,000 on independent lives (70) and (80), paid at the end of the year of death only if the second death occurs in year 5. \(i=0.03\). Life table: \(\ell_{70}=66161.54\), \(\ell_{74}=56640.51\), \(\ell_{75}=53960.80\), \(\ell_{80}=39143.64\), \(\ell_{84}=26607.34\), \(\ell_{85}=23582.45\). Calculate the actuarial present value.`,o:['235','245','255','265','275'],a:0,s:R`\({}_{4|1}q_{\overline{70:80}}={}_{4|1}q_{70}+{}_{4|1}q_{80}-{}_{4|1}q_{70:80}=\frac{2679.71}{66161.54}+\frac{3024.89}{39143.64}-{}_4p_{70:80}\,q_{74:84}\). Numerically \(0.1177792-0.0905572=0.0272217\). APV \(=\frac{10000(0.0272217)}{1.03^5}=234.8\).`},
{t:W3,d:'Medium',q:R`Temporary annuity-immediate on independent lives (30) and (40); \(i=0.06\); \(\ell_{30}=95013.79\), \(\ell_{50}=89509.00\); \(\ddot a_{30:40}=14.2068\), \(\ddot a_{40:50}=12.4784\) (whole life joint annuities-due). Calculate \(a_{30:40:\overline{10}|}\).`,o:['6.64','7.17','7.88','8.74','9.86'],a:1,s:R`\(a_{30:40:\overline{10}|}=a_{30:40}-v^{10}{}_{10}p_{30:40}\,a_{40:50}=13.2068-1.06^{-10}\frac{89509}{95013.79}(11.4784)=7.1687\).`},
{t:W3,d:'Easy',q:R`\(Z\) is the present-value random variable for a discrete whole life insurance of 1 issued to (x) and (y), paying 1 at the first death and 1 at the second death. Given \(a_x=9\), \(a_y=13\) (annuities-immediate) and \(i=0.04\), calculate \(E(Z)\).`,o:['0.08','0.28','0.69','1.08','1.15'],a:3,s:R`\(\ddot a_x=10\), \(\ddot a_y=14\); \(d=\frac{0.04}{1.04}\). \(A_x=1-d\ddot a_x=0.6154\), \(A_y=1-d\ddot a_y=0.4615\). The insurance pays at both deaths, so \(E(Z)=A_{xy}+A_{\overline{xy}}=A_x+A_y=1.0769\).`},
{t:W3,d:'Medium',q:R`Special 3-year annuity-due on two independent lives, both age 80. It pays 30,000 if both are alive and 20,000 if only one is alive. \(p_{80}=0.91\), \({}_2p_{80}=0.82\), \({}_3p_{80}=0.72\); \(i=0.05\). Calculate the actuarial present value.`,o:['78,300','80,400','82,500','84,700','86,800'],a:1,s:R`The payments are \(20000\ddot a_{\overline{80:80}}+10000\ddot a_{80:80}\) with \(\ddot a_{\overline{80:80}}=2\ddot a_{80}-\ddot a_{80:80}\), so APV \(=10000(4\ddot a_{80:\overline3|}-\ddot a_{80:80:\overline3|})\). \(\ddot a_{80:\overline3|}=1+\frac{0.91}{1.05}+\frac{0.82}{1.05^2}=2.61043\); \(\ddot a_{80:80:\overline3|}=1+\frac{0.91^2}{1.05}+\frac{0.82^2}{1.05^2}=2.39855\). APV \(=10000(10.4417-2.3986)=80{,}431\).`},
{t:W3,d:'Medium',q:R`Special 3-year annuity-due on two lives each age \(x\), independent lifetimes. It pays 10,000 if both are alive and 2000 if exactly one is alive. \(q_{xx}=0.04\); \(q_{x+1:x+1}=0.01\); \(i=0.05\). Calculate the actuarial present value.`,o:['27,800','27,900','28,000','28,100','28,200'],a:1,s:R`\(p_{xx}=0.96\Rightarrow p_x=0.979796\). \(p_{x+1:x+1}=0.99\Rightarrow p_{x+1}=0.994987\). Payment structure: \(2000\ddot a_{\overline{xx}}+8000\ddot a_{xx}=2000(2\ddot a_x+3\ddot a_{xx})\). \(\ddot a_{x:\overline3|}=1+\frac{0.979796}{1.05}+\frac{0.979796(0.994987)}{1.05^2}=2.81739\); \(\ddot a_{xx:\overline3|}=1+\frac{0.96}{1.05}+\frac{0.96(0.99)}{1.05^2}=2.77633\). APV \(=2000(5.63478+8.32899)=27{,}928\).`},
{t:W3,d:'Medium',q:R`A continuous two-life annuity pays 100 while both (30) and (40) are alive; 70 while (30) is alive but (40) is dead; and 50 while (40) is alive but (30) is dead. Its actuarial present value is 1180. Continuous single life annuities paying 100 per year have APVs of 1200 for (30) and 1000 for (40). Calculate the actuarial present value of a two-life continuous annuity paying 100 while at least one of them is alive.`,o:['1400','1500','1600','1700','1800'],a:0,s:R`APV \(=100\bar a_{30:40}+70(\bar a_{30}-\bar a_{30:40})+50(\bar a_{40}-\bar a_{30:40})=70\bar a_{30}+50\bar a_{40}-20\bar a_{30:40}\). With \(\bar a_{30}=12\), \(\bar a_{40}=10\): \(840+500-20\bar a_{30:40}=1180\Rightarrow\bar a_{30:40}=8\). Last survivor: \(100(12+10-8)=1400\).`},
{t:W4,d:'Medium',q:R`(70) and (75) are independent; mortality follows De Moivre’s law with \(\omega=100\); \(\bar a_{75}=8.655\). Calculate \(\bar A^{\,1}_{70:75}\), the actuarial present value of 1 paid at the death of (70) if (75) is alive at that time.`,o:['0.2473','0.2885','0.3462','0.4167','0.6606'],a:1,s:R`Condition on \(T_{70}\), uniform on \((0,30)\) with density \(\frac1{30}\): \(\bar A^{\,1}_{70:75}=\int_0^{30}v^t{}_tp_{75}\frac1{30}dt=\frac1{30}\int_0^{25}v^t{}_tp_{75}dt=\frac{8.655}{30}=0.2885\).`},
{t:W4,d:'Medium',q:R`\(Z\) is the present value of a benefit of 1 paid at the death of (y), provided (y) dies after (x), and 0 otherwise. (x) has constant force of mortality 0.07; (y) has constant force 0.09; independent; \(\delta=0.06\). Calculate \(E(Z)\).`,o:['0.191','0.318','0.409','0.600','0.727'],a:0,s:R`\(\bar A^{\,2}_{xy}=\int_0^\infty e^{-0.06t}\big(1-e^{-0.07t}\big)0.09e^{-0.09t}dt=0.09\Big[\frac1{0.15}-\frac1{0.22}\Big]=0.1909\).`},
{t:W4,d:'Hard',q:R`A life insurance on John and Paul, both age \(x\) with the same mortality, pays: 1 at the death of John if Paul is alive; 2 at the death of Paul if John is alive; 3 at the death of John if Paul is dead; 4 at the death of Paul if John is dead. All benefits are at the moment of death. Which expression gives the actuarial present value?`,o:[R`\(7\bar A_x-2\bar A_{xx}\)`,R`\(7\bar A_x-4\bar A_{xx}\)`,R`\(10\bar A_x-2\bar A_{xx}\)`,R`\(10\bar A_x-4\bar A_{xx}\)`,R`\(10\bar A_x-5\bar A_{xx}\)`],a:0,s:R`Benefits 1 and 2 are paid on the first death (1 or 2 depending on who dies first) and benefits 3 and 4 on the second death. With equal ages and laws, \(\bar A^{\,1}_{xx}=\bar A^{\,2}_{xx}=0.5\bar A_{xx}\), giving \(1.5\bar A_{xx}\) from the first two benefits (average of 1 and 2) and \(3.5\bar A_{\overline{xx}}\) from the last two (average of 3 and 4). With \(\bar A_{\overline{xx}}=2\bar A_x-\bar A_{xx}\): \(1.5\bar A_{xx}+3.5(2\bar A_x-\bar A_{xx})=7\bar A_x-2\bar A_{xx}\).`},
{t:W4,d:'Medium',q:R`Insurance on Bill and John: 500 at the moment of Bill’s death if John is alive; 1000 at the moment of John’s death if Bill is dead. Bill’s survival follows De Moivre’s law with \(\omega=85\); John’s with \(\omega=84\). Both are age 80, independent; \(i=0\). Calculate \(E(Z)\).`,o:['600','650','700','750','800'],a:0,s:R`Bill: \(T_B\sim U(0,5)\); John: \(T_J\sim U(0,4)\), independent, so \((T_B,T_J)\) is uniform on a region of area 20. Both benefits are paid exactly when Bill dies first (\(T_B<T_J\)): 500 at \(T_B\) (John alive) and 1000 at \(T_J\) (Bill dead). \(\Pr(T_B<T_J)=\frac{0.5(4)(4)}{20}=0.4\). With \(i=0\): \(E(Z)=1500(0.4)=600\).`},
{t:W5,d:'Easy',q:R`Mortality follows Gompertz’s law for both (35) and (40); \(c^{10}=4\); \(\bar A_{35:40}=0.6\); \(T_{35}\) and \(T_{40}\) are independent. Calculate \(\bar A^{\,1}_{35:40}\).`,o:['0.2','0.24','0.28','0.30','0.32'],a:0,s:R`For Gompertz, \(\bar A^{\,1}_{xy}=\frac{c^x}{c^x+c^y}\bar A_{xy}\). So \(\bar A^{\,1}_{35:40}=\frac{c^{35}}{c^{35}+c^{40}}(0.6)=\frac{1}{1+c^5}(0.6)=\frac{0.6}{1+2}=0.2\).`},
{t:W5,d:'Easy',q:R`Mortality follows Gompertz’s law with \(\mu_x=0.5(1.1)^x\). (40) and (50) are independent. Find \(\bar A^{\,1}_{40:50}\big/\bar A_{40:50}\).`,o:['0.26','0.28','0.36','0.38','0.46'],a:1,s:R`Ratio \(=\frac{c^{40}}{c^{40}+c^{50}}=\frac1{1+1.1^{10}}=\frac1{3.5937}=0.2783\).`},
{t:W5,d:'Medium',q:R`Let \((ww)\) be the equivalent joint equal-age status for \((xy)\) under Makeham’s law with \(c=2\), and let \((z)\) be the equivalent single-life status for \((xy)\) under Gompertz’s law with \(c=2\). Calculate \(z-w\).`,o:['−2','−1','0','1','2'],a:3,s:R`Makeham: \(2\mu_w=\mu_x+\mu_y\Rightarrow w=\frac{\ln(c^x+c^y)-\ln2}{\ln c}\). Gompertz: \(Bc^z=Bc^x+Bc^y\Rightarrow z=\frac{\ln(c^x+c^y)}{\ln c}\). So \(z-w=\frac{\ln2}{\ln c}=1\) for \(c=2\).`}

R`Pr_{h+1}=N\big[{}_hV+G_h(1-c_h)-e_h\big](1+i_{h+1})-N\big[(b_{h+1}+E_{h+1})q_{x+h}+p_{x+h}\,{}_{h+1}V\big]`,
R`\widehat{Pr}_{h+1}=N\big[{}_hV+G_h(1-\hat c_h)-\hat e_h\big](1+\hat i_{h+1})-N\big[(b_{h+1}+\hat E_{h+1})\hat q_{x+h}+\hat p_{x+h}\,{}_{h+1}V\big]`,
R`\mathrm{Gain}_{h+1}=\widehat{Pr}_{h+1}-Pr_{h+1}=Pr^i_{h+1}+Pr^e_{h+1}+Pr^d_{h+1}\quad(\text{interest, then expenses, then mortality})`,
R`Pr^i_{h+1}=N\big[{}_hV+G_h(1-c_h)-e_h\big](\hat i_{h+1}-i_{h+1})`,
R`Pr^e_{h+1}=-N\big[G_h(\hat c_h-c_h)+(\hat e_h-e_h)\big](1+\hat i_{h+1})-N(\hat E_{h+1}-E_{h+1})\,q_{x+h}`,
R`Pr^d_{h+1}=-N\big(b_{h+1}+\hat E_{h+1}-{}_{h+1}V\big)(\hat q_{x+h}-q_{x+h})`]],
['Yield Rates & Replicating Cash Flows',[
R`v(t)=(1+y_t)^{-t},\qquad \big[1+f(t,t+k)\big]^k=\frac{(1+y_{t+k})^{t+k}}{(1+y_t)^t}=\frac{v(t)}{v(t+k)}`,
R`\mathrm{APV(insurance)}=B\sum_{k=0}^{n-1}v(k+1)\,{}_kp_x\,q_{x+k},\qquad \mathrm{APV(annuity)}=B\sum_{k=0}^{n-1}v(k)\,{}_kp_x`,
R`({}_tV+P)\big(1+f(t,t+1)\big)=B\,q_{x+t}+{}_{t+1}V\,p_{x+t}`]],
['Multiple State Models',[
R`\Pr\big[Y_x(k+1)=j\mid Y_x(k)=i\big]=p^{ij}_{x+k}`,
R`{}_sP_x=P_xP_{x+1}\cdots P_{x+s-1},\qquad {}_{t+s}P_x={}_tP_x\,{}_sP_{x+t},\qquad {}_{t+s}p^{ij}_x=\sum_k{}_tp^{ik}_x\,{}_sp^{kj}_{x+t}`,
R`\text{Homogeneous chain: }{}_sP=P^s`,
R`\mathrm{APV}_{s@t}=\sum_{k=0}^{\infty}\sum_{i,j}\Big({}_kp^{si}_t\,p^{ij}_{t+k}\Big)\,C^{ij}_{t+k+1}\,v^{k+1}`]],
['Multiple Decrement Tables & Forces of Decrement',[
R`d^{(\tau)}_x=\sum_{j=1}^m d^{(j)}_x=\ell^{(\tau)}_x-\ell^{(\tau)}_{x+1},\quad q^{(j)}_x=\frac{d^{(j)}_x}{\ell^{(\tau)}_x},\quad q^{(\tau)}_x=\sum_{j}q^{(j)}_x,\quad p^{(\tau)}_x=1-q^{(\tau)}_x`,
R`{}_tp^{(\tau)}_x=\frac{\ell^{(\tau)}_{x+t}}{\ell^{(\tau)}_x}=p^{(\tau)}_xp^{(\tau)}_{x+1}\cdots p^{(\tau)}_{x+t-1},\qquad {}_tq^{(\tau)}_x=\sum_j{}_tq^{(j)}_x=1-{}_tp^{(\tau)}_x`,
R`{}_{t|u}q^{(\tau)}_x=\frac{\ell^{(\tau)}_{x+t}-\ell^{(\tau)}_{x+t+u}}{\ell^{(\tau)}_x},\qquad {}_{t|u}q^{(j)}_x={}_tp^{(\tau)}_x\,{}_uq^{(j)}_{x+t}`,
R`\mu^{(j)}_x=\lim_{h\to0}\frac{{}_hq^{(j)}_x}{h}=-\frac1{\ell^{(\tau)}_x}\frac{d}{dx}\ell^{(j)}_x,\qquad \mu^{(\tau)}_x=\sum_j\mu^{(j)}_x`,
R`f_{T,J}(t,j)={}_tp^{(\tau)}_x\,\mu^{(j)}_{x+t},\qquad f_T(t)={}_tp^{(\tau)}_x\,\mu^{(\tau)}_{x+t},\qquad \Pr(J=j)={}_\infty q^{(j)}_x`,
R`{}_tp^{(\tau)}_x=\exp\Big(-\int_0^t\mu^{(\tau)}_{x+s}\,ds\Big),\qquad {}_tq^{(j)}_x=\int_0^t{}_sp^{(\tau)}_x\,\mu^{(j)}_{x+s}\,ds`]],
['Associated Single Decrement Tables & Assumptions',[
R`{}_tp'^{(j)}_x=\exp\Big(-\int_0^t\mu^{(j)}_{x+s}ds\Big),\qquad {}_tq'^{(j)}_x\ge{}_tq^{(j)}_x,\qquad {}_tp^{(\tau)}_x=\prod_{j}{}_tp'^{(j)}_x`,
R`\mu^{(j)}_{x+t}=-\frac{d}{dt}\ln{}_tp'^{(j)}_x=\frac{\frac{d}{dt}{}_tq^{(j)}_x}{{}_tp^{(\tau)}_x}`,
R`\textbf{Constant force: }{}_sp^{(\tau)}_x=\big(p^{(\tau)}_x\big)^s,\quad {}_sq^{(j)}_x=\frac{q^{(j)}_x}{q^{(\tau)}_x}\Big(1-\big(p^{(\tau)}_x\big)^s\Big),\quad \frac{q^{(j)}_x}{q^{(\tau)}_x}=\frac{\mu^{(j)}_x}{\mu^{(\tau)}_x}=\frac{\ln{}_sp'^{(j)}_x}{\ln{}_sp^{(\tau)}_x}`,
R`\textbf{Partition property: }{}_sp'^{(j)}_x=\big({}_sp^{(\tau)}_x\big)^{q^{(j)}_x/q^{(\tau)}_x}`,
R`\textbf{Uniform decrements in the multiple decrement table: }{}_sq^{(j)}_x=s\,q^{(j)}_x,\qquad \mu^{(j)}_{x+s}=\frac{q^{(j)}_x}{1-s\,q^{(\tau)}_x}`,
R`\textbf{Uniform in the single decrement tables: }{}_sq^{(1)}_x=s\,q'^{(1)}_x\Big(1-\tfrac s2\,q'^{(2)}_x\Big)`,
R`{}_sq^{(1)}_x=q'^{(1)}_x\Big(s-\tfrac{s^2}{2}\big(q'^{(2)}_x+q'^{(3)}_x\big)+\tfrac{s^3}{3}\,q'^{(2)}_xq'^{(3)}_x\Big)`]],
['Multiple Decrement: APVs & Reserves',[
R`\int_0^\infty c_t\,v^t\,{}_tp^{(\tau)}_x\,dt,\qquad \sum_{j=1}^m\int_0^\infty b^{(j)}_t\,v^t\,{}_tp^{(\tau)}_x\,\mu^{(j)}_{x+t}\,dt`,
R`\sum_{k=0}^{n-1}c_k\,v^k\,{}_kp^{(\tau)}_x,\qquad \sum_{j=1}^m\sum_{k=0}^{n-1}b^{(j)}_{k+1}\,v^{k+1}\,{}_kp^{(\tau)}_x\,q^{(j)}_{x+k}`,
R`{}_{h+1}V^n=\frac{({}_hV+\pi_h)(1+i)-b^{(d)}_{h+1}q^{(d)}_{x+h}-b^{(w)}_{h+1}q^{(w)}_{x+h}}{1-q^{(d)}_{x+h}-q^{(w)}_{x+h}}`,
R`{}_{h+1}V^g=\frac{\big({}_hV^g+(1-c_h)G_h-e_h\big)(1+i)-(b^{(d)}_{h+1}+E_{h+1})q^{(d)}_{x+h}-(b^{(w)}_{h+1}+E_{h+1})q^{(w)}_{x+h}}{1-q^{(d)}_{x+h}-q^{(w)}_{x+h}}`]]
];
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet(0)});
const fsf=v=>document.querySelectorAll('#sheet details.fs').forEach(d=>{d.style.display=d.querySelector('summary').textContent.toLowerCase().includes(v.toLowerCase())?'':'none'});
function sheet(o){let el=document.getElementById('sheet');if(!o){if(el)el.remove();return}if(el)return;
 el=document.createElement('div');el.id='sheet';el.className='fixed inset-0 z-50 flex justify-end bg-black/50';el.onclick=e=>{if(e.target===el)sheet(0)};
 el.innerHTML=`<div class="w-full max-w-2xl h-full overflow-y-auto bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 shadow-xl" style="padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem)"><div class="flex items-center justify-between mb-3 sticky top-0 bg-white dark:bg-slate-900 py-1 z-10"><h2 class="text-lg font-semibold">Math 260 Formula Sheet</h2><button class="${btn()}" onclick="sheet(0)">Close ✕</button></div><input placeholder="Filter sections (e.g. asset, decrement, reserve)" class="w-full mb-3 p-2 rounded border border-slate-300 dark:border-slate-600 bg-transparent text-sm" oninput="fsf(this.value)">${FS.map((s,i)=>`<details class="fs ${card} mb-2" ${i==0?'open':''}><summary class="cursor-pointer font-medium">${s[0]}</summary>${s[1].map(f=>'<div class="eq">\\['+esc(f)+'\\]</div>').join('')}</details>`).join('')}</div>`;
 document.body.appendChild(el);tp()}
/* ---------- screens ---------- */
function head(r,inQuiz){const nm=Object.keys(DB.miss).length;
 return `<div class="flex flex-wrap items-center justify-between gap-2 mb-4"><div><div class="text-xs uppercase tracking-wide text-slate-500">SOA Exam MLC · Reserves, Expenses &amp; Multiple Decrements</div><h1 class="text-2xl font-semibold">${EXAM}</h1></div><div class="flex items-center gap-2">${r||''}${S.fs||S.scr!='quiz'?`<button onclick="sheet(1)" class="${btn()}">Formula Sheet</button>`:''}${inQuiz?'':`<button onclick="hub()" class="${btn()}">Review Hub${nm?' ('+nm+')':''}</button>`}<button onclick="S.dark=!S.dark;theme()" class="${btn()}">◐ Theme</button></div></div>`}
const tg=i=>{S.sel.has(i)?(S.sel.size>1&&S.sel.delete(i)):S.sel.add(i);setup()};
const preset=()=>{S.sel=new Set(CHS.map((_,i)=>i));setup()};
function setup(){S.scr='setup';const p=srcPool(),n=Math.min(S.n,p.length),nm=Object.keys(DB.miss).length,nb=Object.keys(DB.bm).length;
 const counts=[5,10,15,20,30,p.length].filter((c,i,a)=>i==a.length-1||c<p.length);
 const row=(t,items)=>`<div><div class="font-medium mb-2">${t}</div><div class="flex gap-2 flex-wrap">${items}</div></div>`;
 const b=(a,f,l)=>`<button class="${btn(a)}" onclick="${f}">${l}</button>`;
 const mods=CHS.map((c,i)=>{const on=S.sel.has(i),n=Q.filter(q=>q.c==i).length,wsel=on&&S.dist!='rnd'&&S.src=='all'?`<select class="rounded border border-slate-300 dark:border-slate-600 bg-transparent text-sm p-1" title="Weight" onchange="S.w[${i}]=+this.value;setup()">${[1,2,3].map(w=>`<option value="${w}" ${(S.w[i]||1)==w?'selected':''}>×${w}</option>`).join('')}</select>`:'';
  return `<div class="flex items-center gap-1"><button class="${btn(on)} text-left flex-1" onclick="tg(${i})"><b>${c.n}</b> <span class="opacity-70">(${n} questions)</span><div class="text-xs opacity-80 font-normal">${c.t.join(' · ')}</div></button>${wsel}</div>`}).join('');
 app.innerHTML=head()+`<div class="${card} space-y-5">
${row('Question source',b(S.src=='all',"S.src='all';setup()",'All questions')+b(S.src=='miss',"S.src='miss';setup()",'Missed only ('+nm+')')+b(S.src=='bm',"S.src='bm';setup()",'Bookmarked ('+nb+')'))}
${row('Mode',b(S.mode=='practice',"S.mode='practice';setup()",'Practice (instant feedback)')+b(S.mode=='exam',"S.mode='exam';setup()",'Exam (timed)'))}
${row('Number of questions',counts.map(c=>b(S.n==c,`S.n=${c};setup()`,c==p.length?'All ('+c+')':c==30?'30 (full length)':c)).join(''))}
${row('Difficulty',['All',...D].map(d=>b(S.diff==d,`S.diff='${d}';setup()`,d=='All'?'All / Mixed':d=='Medium'?'Medium / Exam Standard':d)).join(''))}
${row('Formula sheet during the session',b(S.fs,"S.fs=true;setup()",'Available')+b(!S.fs,"S.fs=false;setup()",'Hidden (exam-style)'))}
<div><div class="font-medium mb-2">Chapters to sample from</div><div class="flex gap-2 flex-wrap mb-2">${b(0,'preset()','Select all')}</div><div class="grid sm:grid-cols-2 gap-2">${mods}</div></div>
${row('Spread across selected chapters',b(S.dist=='bal',"S.dist='bal';setup()",'Balanced (equal per chapter)')+b(S.dist=='prop',"S.dist='prop';setup()",'Proportional to chapter size')+b(S.dist=='rnd',"S.dist='rnd';setup()",'Pure random'))}
<div class="text-xs text-slate-500">${S.dist=='rnd'||S.src!='all'?'Questions are drawn at random from the whole selection.':'Use the ×1/×2/×3 weights beside each selected chapter to over-sample weak areas.'}</div>
<div class="text-sm text-slate-600 dark:text-slate-300">${n} of ${p.length} available · ${S.mode=='exam'?'Time limit '+fmt(n*MIN_PER_Q*60)+' (6 min per question, SOA pace)':'Untimed; an elapsed timer is shown'}</div>
<button class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium" onclick="start()">Start session</button></div>`}
function start(){const s=sample(S.n);if(!s.length){alert('No questions match these settings.');return}
 S.set=s;S.ans={};S.flag={};S.time=s.map(()=>0);S.cur=0;S.el=0;S.limit=s.length*MIN_PER_Q*60;S.scr='quiz';clearInterval(S.tm);S.tm=setInterval(tick,1000);quiz()}
function startSrc(src){S.src=src;S.sel=new Set(ALL);S.diff='All';S.n=999;S.mode='practice';start()}
function tick(){S.el++;S.time[S.cur]++;const e=$('#clk');if(e)e.textContent=S.mode=='exam'?fmt(Math.max(0,S.limit-S.el)):fmt(S.el);if(S.mode=='exam'&&S.el>=S.limit)finish()}
const pick=k=>{S.ans[S.cur]=k;quiz()};
const toggleBm=id=>{DB.bm[id]?delete DB.bm[id]:DB.bm[id]=1;save();quiz()};
function quiz(){const i=S.cur,q=S.set[i],a=S.ans[i],locked=S.mode=='practice'&&a!=null,pct=Object.keys(S.ans).length/S.set.length*100;
 const nav=S.set.map((_,k)=>{let c=S.ans[k]!=null?'bg-indigo-600 text-white border-indigo-600':'border-slate-300 dark:border-slate-600';if(S.flag[k])c+=' ring-2 ring-amber-400';if(k==i)c+=' outline outline-2 outline-offset-1 outline-slate-500';return`<button onclick="S.cur=${k};quiz()" class="w-9 h-9 rounded-md border text-sm ${c}">${k+1}</button>`}).join('');
 const opts=q.o.map((o,k)=>{let c='border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700';if(a==k)c='border-indigo-500 bg-indigo-50 dark:bg-indigo-950';if(locked){if(k==q.a)c='border-emerald-500 bg-emerald-50 dark:bg-emerald-950';else if(a==k)c='border-red-500 bg-red-50 dark:bg-red-950'}return`<button ${locked?'disabled':''} onclick="pick(${k})" class="w-full text-left flex items-center gap-3 p-3 rounded-lg border ${c}"><b class="w-6 shrink-0">${L[k]}.</b><span class="opt">${fmtO(o)}</span></button>`}).join('');
 app.innerHTML=head(`<span class="px-2 py-1 rounded bg-slate-200 dark:bg-slate-700 text-xs">${S.mode=='exam'?'EXAM':'PRACTICE'}</span><span id="clk" class="font-mono text-lg">${S.mode=='exam'?fmt(Math.max(0,S.limit-S.el)):fmt(S.el)}</span>`,1)+
 `<div class="h-2 rounded bg-slate-200 dark:bg-slate-700 mb-1"><div class="h-2 rounded bg-indigo-600" style="width:${pct}%"></div></div><div class="text-xs text-slate-500 mb-4">${Object.keys(S.ans).length} of ${S.set.length} answered</div>
<div class="grid md:grid-cols-[1fr_220px] gap-4"><div class="${card}"><div class="flex flex-wrap gap-2 text-xs mb-4"><span class="px-2 py-1 rounded bg-indigo-100 dark:bg-indigo-950">${CHS[q.c].n} · ${q.t}</span><span class="px-2 py-1 rounded bg-slate-200 dark:bg-slate-700">${q.d}</span><span class="ml-auto text-slate-500">Question ${i+1} / ${S.set.length}</span></div>
<div class="q mb-5">${fmtQ(q.q)}</div><div class="space-y-2">${opts}</div>
${locked?`<div class="sol mt-4 p-4 rounded-lg bg-slate-100 dark:bg-slate-900 text-sm"><b>${a==q.a?'✓ Correct.':'✗ Incorrect — the answer is '+L[q.a]+'.'}</b>${fmtS(q.s)}</div>`:''}
<div class="flex gap-2 mt-5 flex-wrap"><button class="${btn()}" ${i?'':'disabled'} onclick="S.cur--;quiz()">← Prev</button><button class="${btn(S.flag[i])}" onclick="S.flag[${i}]=!S.flag[${i}];quiz()">⚑ Flag</button><button class="${btn(DB.bm[q.id])}" onclick="toggleBm(${q.id})">★ Bookmark</button><button class="${btn()}" ${i<S.set.length-1?'':'disabled'} onclick="S.cur++;quiz()">Next →</button><button class="ml-auto px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm" onclick="if(confirm('Submit and see your report?'))finish()">Submit</button></div></div>
<div class="${card} h-fit"><div class="font-medium text-sm mb-2">Navigator</div><div class="flex flex-wrap gap-1.5">${nav}</div><div class="text-xs text-slate-500 mt-3 space-y-1"><div>■ Answered (filled)</div><div>□ Unanswered (outline)</div><div>◌ Flagged (amber ring)</div></div></div></div>`;tp()}
function finish(){if(S.scr!='quiz')return;clearInterval(S.tm);S.scr='report';
 const r=S.set.map((q,i)=>({q,i,ok:S.ans[i]==q.a,t:S.time[i]})),c=r.filter(x=>x.ok).length,pc=Math.round(c/r.length*100);
 DB.hist.unshift({ts:Date.now(),mode:S.mode,n:r.length,diff:S.diff,score:c,el:S.el,items:r.map(x=>({id:x.q.id,t:x.q.t,d:x.q.d,a:S.ans[x.i]??null,ok:x.ok,time:x.t}))});DB.hist=DB.hist.slice(0,50);
 r.forEach(x=>{if(S.ans[x.i]==null)return;if(x.ok)delete DB.miss[x.q.id];else DB.miss[x.q.id]={n:(DB.miss[x.q.id]?.n||0)+1,ts:Date.now()}});save();
 const grp=(key,keys)=>keys.map(k=>{const g=r.filter(x=>x.q[key]==k);if(!g.length)return'';const gc=g.filter(x=>x.ok).length;return`<tr class="border-t border-slate-200 dark:border-slate-700"><td class="py-2 pr-2">${key=='c'?CHS[k].n:k}</td><td>${gc}/${g.length}</td><td>${Math.round(gc/g.length*100)}%</td><td>${fmt(Math.round(g.reduce((s,x)=>s+x.t,0)/g.length))}</td></tr>`}).join('');
 const tbl=(h,bd)=>`<div class="${card} overflow-x-auto"><table class="w-full text-sm text-left"><thead class="text-slate-500"><tr><th class="pb-2">${h}</th><th>Correct</th><th>Score</th><th>Avg time</th></tr></thead><tbody>${bd}</tbody></table></div>`;
 S.sum=`${EXAM}: ${c}/${r.length} (${pc}%), ${S.mode}, time ${fmt(S.el)}\n`+r.map(x=>`${x.i+1}. ${x.ok?'correct':'wrong'} · ${x.q.t} · ${x.q.d} · ${fmt(x.t)}`).join('\n');
 app.innerHTML=head()+`<div class="${card} mb-4 flex flex-wrap gap-6 items-center"><div class="text-4xl font-bold">${pc}%</div><div class="text-sm">${c} of ${r.length} correct<br>Unanswered: ${r.filter(x=>S.ans[x.i]==null).length}<br>Total time: ${fmt(S.el)}</div><div class="ml-auto flex gap-2 flex-wrap"><button class="${btn()}" onclick="navigator.clipboard.writeText(S.sum).then(()=>alert('Summary copied')).catch(()=>alert('Copy is not available here'))">Copy summary</button>${Object.keys(DB.miss).length?`<button class="${btn()}" onclick="startSrc('miss')">Practice missed (${Object.keys(DB.miss).length})</button>`:''}<button class="${btn(1)}" onclick="S.src='all';setup()">New session</button></div></div>
<div class="grid md:grid-cols-2 gap-4 mb-4">${tbl('Chapter',grp('c',CHS.map((_,i)=>i)))}${tbl('Difficulty',grp('d',D))}</div><div class="mb-4">${tbl('Topic',grp('t',ALL))}</div>
<div class="space-y-3">${r.map(x=>`<details class="${card}"><summary class="cursor-pointer flex flex-wrap gap-2 items-center"><b>${x.i+1}.</b><span class="${x.ok?'text-emerald-600':'text-red-600'}">${x.ok?'✓ Correct':S.ans[x.i]==null?'— Unanswered':'✗ Incorrect'}</span><span class="text-xs text-slate-500">${x.q.t} · ${x.q.d} · ${fmt(x.t)}</span></summary><div class="q mt-3">${fmtQ(x.q.q)}</div><p class="mt-2 text-sm">Your answer: <b>${S.ans[x.i]==null?'—':L[S.ans[x.i]]+') '+x.q.o[S.ans[x.i]]}</b> · Correct: <b>${L[x.q.a]}) ${x.q.o[x.q.a]}</b></p><div class="sol mt-2 p-4 rounded-lg bg-slate-100 dark:bg-slate-900 text-sm">${fmtS(x.q.s)}</div></details>`).join('')}</div>`;tp()}
function hub(){S.scr='hub';clearInterval(S.tm);const ids=o=>Object.keys(o).map(Number).filter(i=>Q[i]);
 const tab=(k,l)=>`<button class="${btn(S.tab==k)}" onclick="S.tab='${k}';hub()">${l}</button>`;
 const list=(o,note)=>ids(o).length?ids(o).map(id=>{const q=Q[id];return`<details class="${card}"><summary class="cursor-pointer flex flex-wrap gap-2 items-center"><span class="text-xs px-2 py-1 rounded bg-indigo-100 dark:bg-indigo-950">${q.t}</span><span class="text-xs text-slate-500">${q.d}${note(id)}</span></summary><div class="q mt-3">${fmtQ(q.q)}</div><p class="mt-2 text-sm">Correct: <b>${L[q.a]}) ${q.o[q.a]}</b></p><div class="sol mt-2 p-4 rounded-lg bg-slate-100 dark:bg-slate-900 text-sm">${fmtS(q.s)}</div>${S.tab=='bm'?`<button class="${btn()} mt-3" onclick="delete DB.bm[${id}];save();hub()">Remove bookmark</button>`:''}</details>`}).join(''):'<div class="text-slate-500 text-sm">Nothing here yet.</div>';
 let body;
 if(S.tab=='hist')body=DB.hist.length?`<div class="space-y-2">${DB.hist.map(h=>`<details class="${card}"><summary class="cursor-pointer flex flex-wrap gap-3 items-center"><b>${new Date(h.ts).toLocaleString()}</b><span>${h.score}/${h.n} (${Math.round(h.score/h.n*100)}%)</span><span class="text-xs text-slate-500">${h.mode} · ${h.diff} · ${fmt(h.el)}</span></summary>${h.items.map((it,j)=>`<div class="text-sm py-1 border-t border-slate-200 dark:border-slate-700">${j+1}. ${it.ok?'✓':it.a==null?'—':'✗'} ${it.t} · ${it.d} · ${fmt(it.time)}</div>`).join('')}</details>`).join('')}</div><button class="${btn()} mt-3" onclick="if(confirm('Clear all history?')){DB.hist=[];save();hub()}">Clear history</button>`:'<div class="text-slate-500 text-sm">No attempts yet.</div>';
 else body=`<div class="space-y-2">${S.tab=='miss'?list(DB.miss,id=>' · missed '+DB.miss[id].n+'×'):list(DB.bm,()=>'')}</div>`;
 const cnt=S.tab=='miss'?ids(DB.miss).length:ids(DB.bm).length;
 app.innerHTML=head()+`<div class="flex gap-2 flex-wrap mb-4">${tab('miss','Mistake Bank ('+ids(DB.miss).length+')')+tab('bm','Bookmarks ('+ids(DB.bm).length+')')+tab('hist','History ('+DB.hist.length+')')}<button class="${btn()} ml-auto" onclick="setup()">← Back to setup</button>${S.tab!='hist'&&cnt?`<button class="${btn(1)}" onclick="startSrc('${S.tab}')">Practice these (${cnt})</button>`:''}</div>${body}<div class="text-xs text-slate-500 mt-4">A missed question leaves the Mistake Bank once you answer it correctly. Data is stored in this browser only.</div>`;tp()}
theme();setup();
</script>
